<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anteiku Hub - Digital Literary Café</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            /* 2. SMOKY BACKGROUND GRADIENT */
            background: radial-gradient(circle at 50% 40%, #16110f 0%, #0c0806 70%);
            background-color: #0c0806; 
            color: #f5f0eb; 
            font-family: 'Inter', sans-serif; 
        }
        h1, h2, h3, h4, h5, h6, .cafe-header { 
            font-family: 'Cinzel', serif; 
            color: #fbbf24; 
        }
        
        /* Espresso Theme Custom Scrollbar Overrides */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #16100d; }
        ::-webkit-scrollbar-thumb { background: #453026; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #fbbf24; }
        
        /* Hardware Accelerated UI Animations */
        .animate-fadeIn {
            animation: fadeIn 0.2s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98) translateY(4px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes bounceSlow {
            0%, 100__ { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .coffee-bounce {
            animation: bounceSlow 2s infinite ease-in-out;
        }

        /* 1 & 3. THE STEAM EFFECT & MOVEMENT RULES */
        @keyframes wavy-smoke-drift {
            0% {
                transform: translateY(100vh) translateX(0) scaleX(1);
                opacity: 0;
            }
            10% {
                opacity: 0.04;
            }
            40% {
                transform: translateY(50vh) translateX(25px) scaleX(1.2);
                opacity: 0.05;
            }
            70% {
                transform: translateY(20vh) translateX(-20px) scaleX(0.9);
                opacity: 0.02;
            }
            100% {
                transform: translateY(-20vh) translateX(10px) scaleX(1.1);
                opacity: 0;
            }
        }

        .steam-line {
            position: absolute;
            bottom: 0;
            fill: none;
            stroke: #fbbf24; /* Muted yellow/amber steam to cast a warm glow */
            stroke-width: 2;
            stroke-linecap: round;
            opacity: 0;
            pointer-events: none;
            will-change: transform, opacity;
        }

        .steam-1 {
            left: 25%;
            animation: wavy-smoke-drift 14s infinite linear;
        }
        .steam-2 {
            left: 55%;
            animation: wavy-smoke-drift 18s infinite linear;
            animation-delay: 4s;
        }
        .steam-3 {
            left: 78%;
            animation: wavy-smoke-drift 16s infinite linear;
            animation-delay: 8s;
        }
    </style>
</head>
<body class="min-h-screen relative overflow-x-hidden select-none">

    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0" aria-hidden="true">
        <svg class="steam-line steam-1" width="60" height="200" viewBox="0 0 60 200">
            <path d="M30,200 C45,150 15,100 30,50 C45,0 30,-50 30,-100" />
        </svg>
        <svg class="steam-line steam-2" width="60" height="200" viewBox="0 0 60 200">
            <path d="M30,200 C15,160 45,120 30,80 C15,40 35,0 30,-40" />
        </svg>
        <svg class="steam-line steam-3" width="60" height="200" viewBox="0 0 60 200">
            <path d="M30,200 C50,140 20,90 35,40 C50,-10 25,-40 30,-90" />
        </svg>
    </div>

    <div id="app" class="min-h-screen flex flex-col relative z-10"></div>

    <script>
        // --- FIXED SAMPLE REPOSITORY INITIALIZATION ---
        const hardcodedSampleArticles = [
            { 
                id: 'seed-gaming', 
                title: 'The Architecture of Virtual Solitude', 
                subtitle: 'Analyzing pacing, environmental design, and quiet structural ecosystems in modern open-world gaming.', 
                readTime: '9 min read', 
                category: '#Gaming', 
                author: 'Ken Kaneki', 
                body: 'To step inside a true virtual space is to accept an alternative pace. We dissect how minimal environments craft intentional narrative depth, pushing back against competitive metrics to cultivate personal headspace.' 
            },
            { 
                id: 'seed-sports', 
                title: 'The Analytical Mind on the Pitch', 
                subtitle: 'Tactical philosophy, geometric positioning, and the deep reading of space in athletics.', 
                readTime: '7 min read', 
                category: '#Sports', 
                author: 'Alex Thorne', 
                body: 'Modern sports setups mirror complex structural algorithms. Beyond physical execution lies a deep chess match written across manicured turf, prioritizing temporal mastery over brute physical acceleration.' 
            },
            { 
                id: 'seed-education', 
                title: 'Sipping Ink at Midnight', 
                subtitle: 'A structural reflection on classic literary forms, educational architecture, and slow acquisition models.', 
                readTime: '5 min read', 
                category: '#Education', 
                author: 'Suzuya', 
                body: 'Porcelain steam catches the soft study lamp light. Real learning requires a distinct internal friction—a step back away from speed reading modules and rapid-fire video updates into quiet, concentrated study nodes.' 
            },
            { 
                id: 'seed-news', 
                title: 'The Velocity of Digital Broadcast Networks', 
                subtitle: 'Unpacking rapid-fire breaking news cycles, information fatigue, and verified editorial streams.', 
                readTime: '4 min read', 
                category: '#News', 
                author: 'Touka Kirishima', 
                body: 'The constant stream of breaking alerts often dilutes deep contextual truth. In this essay, we look at how rapid news distribution reshapes editorial standards and why returning to decentralized, slower verified print structures protects civic awareness.' 
            },
            { 
                id: 'seed-knowledge', 
                title: 'The Baseline Physics of Espresso Alchemy', 
                subtitle: 'A thermodynamic deep dive into extraction yields, volatile oil chemistry, and roast profiles.', 
                readTime: '6 min read', 
                category: '#GeneralKnowledge', 
                author: 'Manager Yoshimura', 
                body: 'Water meeting ground coffee at exactly 9 bar atmospheric pressure is a precise science experiment. We track how pressure variables, organic chemistry arrays, and regional water mineral scaling curves impact the final beverage composition.' 
            }
        ];

        // --- CORE APPLICATION STATE ENGINE ---
        function bootstrapCoreEngine() {
            const isAuth = localStorage.getItem('anteiku_authenticated') === 'true';
            
            const savedProfile = localStorage.getItem('anteiku_profile');
            const profile = savedProfile ? JSON.parse(savedProfile) : {
                name: 'Ken Kaneki',
                username: 'books_and_brews',
                bio: 'Lover of tragic short stories and slow drip pour-overs. Writing from the corner booth.',
                followers: 142
            };

            const savedArticles = localStorage.getItem('anteiku_articles');
            let articles = hardcodedSampleArticles;
            if (savedArticles) {
                try {
                    const parsed = JSON.parse(savedArticles);
                    if (parsed && parsed.length > 0) articles = parsed;
                } catch(e) {
                    articles = hardcodedSampleArticles;
                }
            }
            localStorage.setItem('anteiku_articles', JSON.stringify(articles));

            const savedNotifications = localStorage.getItem('anteiku_notifications');
            const defaultNotifications = [
                { id: 1, type: 'rating', message: "User123 rated your article 'The Architecture of Virtual Solitude' 5 Coffee Beans! ☕", unread: true },
                { id: 2, type: 'like', message: "User123 liked your article 'The Architecture of Virtual Solitude'.", unread: true },
                { id: 3, type: 'follower', message: "User123 started following your profile.", unread: false }
            ];
            const notifications = savedNotifications ? JSON.parse(savedNotifications) : defaultNotifications;
            if(!savedNotifications) localStorage.setItem('anteiku_notifications', JSON.stringify(defaultNotifications));

            return {
                isAuthenticated: isAuth,
                currentView: isAuth ? 'FEED' : 'LANDING',
                profile: profile,
                databaseArticles: articles,
                notifications: notifications,
                activeFilter: '#All',
                isCategoryDropdownOpen: false,
                isNotificationDropdownOpen: false,
                selectedBeanRating: 0,
                selectedArticleId: articles[0].id,
                writerSelectedCategory: 'Gaming',
                customToast: { show: false, title: '', message: '' },
                showRewardModal: false,
                aiChatHistory: [
                    { sender: 'bot', text: 'Welcome back to the text refinery. Enter any subject parameters (e.g., "give me a FIFA World Cup idea") and I will provide functional structures, custom titles, and talking blueprints.' }
                ]
            };
        }

        let state = bootstrapCoreEngine();

        const categories = [
            { id: '#All', label: 'All Categories', tag: '#All' },
            { id: '#Gaming', label: 'Gaming', tag: '#Gaming' },
            { id: '#Sports', label: 'Sports', tag: '#Sports' },
            { id: '#Education', label: 'Education', tag: '#Education' },
            { id: '#News', label: 'News', tag: '#News' },
            { id: '#GeneralKnowledge', label: 'General Knowledge', tag: '#GeneralKnowledge' }
        ];

        function triggerInlineToast(title, message) {
            state.customToast = { show: true, title, message };
            render();
            setTimeout(() => {
                state.customToast.show = false;
                render();
            }, 4000);
        }

        function navigateTo(view) {
            state.currentView = state.isAuthenticated ? view : 'LANDING';
            state.isCategoryDropdownOpen = false;
            state.isNotificationDropdownOpen = false;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function handleSignIn(e) {
            if (e) e.preventDefault();
            state.isAuthenticated = true;
            localStorage.setItem('anteiku_authenticated', 'true');
            navigateTo('FEED');
            triggerInlineToast('Authorization Succeeded', 'Your table space token has been validated.');
        }

        function handleSignOut() {
            state.isAuthenticated = false;
            localStorage.setItem('anteiku_authenticated', 'false');
            navigateTo('LANDING');
        }

        function handleProfileSave(e) {
            if (e) e.preventDefault();
            state.profile.name = document.getElementById('edit-name').value;
            state.profile.username = document.getElementById('edit-username').value.replace('@', '');
            state.profile.bio = document.getElementById('edit-bio').value;
            
            localStorage.setItem('anteiku_profile', JSON.stringify(state.profile));
            executeIncomingNotificationSimulation('follower', null);
            triggerInlineToast('Local Ledger Mutated', 'Your profile adjustments are safely saved to local cache maps.');
            navigateTo('ACCOUNT'); 
        }

        function handlePublishArticle(e) {
            if (e) e.preventDefault();
            const titleInput = document.getElementById('w-title').value.trim();
            const subtitleInput = document.getElementById('w-subtitle').value.trim();
            const bodyInput = document.getElementById('w-body').value.trim();
            
            if (!titleInput || !bodyInput) {
                triggerInlineToast('Validation Error', 'Both title and content body lines must be fully written.');
                return;
            }

            const newPost = {
                id: String(Date.now()),
                title: titleInput,
                subtitle: subtitleInput || 'An analytical study curated over premium brew.',
                readTime: `${Math.max(1, Math.ceil(bodyInput.split(' ').length / 160))} min read`,
                category: `#${state.writerSelectedCategory}`,
                author: state.profile.name,
                body: bodyInput
            };

            state.databaseArticles.unshift(newPost);
            localStorage.setItem('anteiku_articles', JSON.stringify(state.databaseArticles));
            
            executeIncomingNotificationSimulation('like', titleInput);
            triggerInlineToast('Article Synchronized', `New post launched under the ${newPost.category} classification banner.`);
            navigateTo('ACCOUNT');
        }

        function handleSendAiPrompt() {
            const inputElement = document.getElementById('ai-chat-input');
            if (!inputElement || !inputElement.value.trim()) return;
            
            const rawPrompt = inputElement.value.trim();
            state.aiChatHistory.push({ sender: 'user', text: rawPrompt });
            
            const normalized = rawPrompt.toLowerCase();
            let aiReply = '';

            if (normalized.includes('fifa') || normalized.includes('world cup') || normalized.includes('sports')) {
                aiReply = `☕ **AI Barista Custom Sports Architecture Output:**\n\n* **Bespoke Title:** *The Kinetic Grid: Mapping Space Allocation and Defensive Solitude at the World Cup.*\n* **Narrative Concept:** Analyze strategic empty zones on fields and contrast high-tension gameplay loops against architectural sports landscapes.\n* **Talking Points Array:** \n  1. The spatial geometry of low-block defensive sets.\n  2. Mass emotional focus shifts in international sports models.\n  3. Cultural footprint left behind when large event infrastructure sits empty.`;
            } else if (normalized.includes('gaming') || normalized.includes('game') || normalized.includes('play')) {
                aiReply = `☕ **AI Barista Custom Gaming Framework Output:**\n\n* **Bespoke Title:** *Virtual Quietude: Evaluating Atmospheric Silence Algorithms inside Open-World Ecosystems.*\n* **Narrative Concept:** Evaluate why players often walk away from competitive game tasks simply to look at the landscape rendering rules.\n* **Talking Points Array:**\n  1. Escaping constant overlay tracking metrics.\n  2. Micro-architectures of quiet towns in virtual maps.\n  3. Sound engineering rules that support deep player immersion.`;
            } else if (normalized.includes('education') || normalized.includes('learn') || normalized.includes('school')) {
                aiReply = `☕ **AI Barista Custom Educational Logic Output:**\n\n* **Bespoke Title:** *Cognitive Resistance Scaffolding: Dissecting Long-Form Focus in the Fast-Paced Summary Era.*\n* **Narrative Concept:** Make an analytical argument for slow study methods instead of relying on immediate bulleted text files.\n* **Talking Points Array:**\n  1. Why deep learning requires mental effort to remember info.\n  2. Designing interfaces that slow down high-speed reading habits.\n  3. Reclaiming long-term focus through quiet reading routines.`;
            } else {
                aiReply = `☕ **AI Barista Core Writing Framework Output:**\n\n* **Bespoke Title:** *The Structural Undercurrents of "${rawPrompt}": A Cultural Examination.*\n* **Narrative Concept:** Deconstruct common assumptions surrounding this topic and evaluate its hidden systemic impacts.\n* **Talking Points Array:**\n  1. Surface-level misunderstandings versus operational reality.\n  2. The psychological changes this topic causes in online discourse loops.\n  3. Clear solutions to help restore analytical balance.`;
            }

            state.aiChatHistory.push({ sender: 'bot', text: aiReply });
            render();
            
            const targetPane = document.getElementById('chat-scroll-pane');
            if(targetPane) targetPane.scrollTop = targetPane.scrollHeight;
        }

        function executeIncomingNotificationSimulation(type, title) {
            let message = '';
            if (type === 'rating') {
                message = `User123 rated your article '${title}' 5 Coffee Beans! ☕`;
            } else if (type === 'like') {
                message = `User123 liked your article '${title}'.`;
            } else {
                message = `User123 started following your profile.`;
                state.profile.followers += 1;
                localStorage.setItem('anteiku_profile', JSON.stringify(state.profile));
            }

            state.notifications.unshift({ id: Date.now(), type, message, unread: true });
            localStorage.setItem('anteiku_notifications', JSON.stringify(state.notifications));
        }

        function clearAllNotifications() {
            state.notifications = state.notifications.map(n => ({ ...n, unread: false }));
            localStorage.setItem('anteiku_notifications', JSON.stringify(state.notifications));
            render();
        }

        function handleRatingSubmission() {
            if (state.selectedBeanRating === 0) {
                triggerInlineToast('Evaluation Empty', 'Please pick a rating value using the bean grid configuration.');
                return;
            }
            const currentPost = state.databaseArticles.find(a => a.id === state.selectedArticleId) || state.databaseArticles[0];
            if (state.selectedBeanRating >= 4) {
                executeIncomingNotificationSimulation('rating', currentPost.title);
            }
            state.showRewardModal = true;
            render();
        }

        // --- PLATFORM VIEW COMPILER ENGINE ---
        function render() {
            const app = document.getElementById('app');
            const unreadCount = state.notifications.filter(n => n.unread).length;

            // --- SIGN-IN MODAL WALL CHECK ---
            if (!state.isAuthenticated || state.currentView === 'LANDING') {
                app.innerHTML = `
                    <div class="min-h-screen flex flex-col justify-center items-center p-4 relative">
                        <div class="max-w-md w-full space-y-6 z-10 animate-fadeIn bg-[#16100d] border border-[#3c2a22] p-8 rounded-2xl shadow-2xl">
                            <div class="text-center space-y-2">
                                <div class="flex justify-center mb-1">
                                    <div class="p-4 bg-[#231915] border border-[#523b30] rounded-full">
                                        <i data-lucide="coffee" class="w-10 h-10 text-[#fbbf24]"></i>
                                    </div>
                                </div>
                                <h1 class="text-4xl font-bold tracking-wide text-[#fbbf24]">Anteiku Hub</h1>
                                <p class="text-md text-[#fbbf24] italic font-medium">Read deeply. Write freely.</p>
                                <p class="text-xs text-[#f5f0eb]/90 max-w-sm mx-auto font-light pt-1 leading-relaxed">
                                    Sign-in mandatory overlay screen. Your authorization credentials persist natively across reloads.
                                </p>
                            </div>

                            <form onsubmit="handleSignIn(event)" class="space-y-4 pt-2">
                                <div>
                                    <label class="text-xs uppercase tracking-wider text-[#f5f0eb] font-bold block mb-1.5">Cafe ID (Email)</label>
                                    <input type="email" required placeholder="writer@anteiku.com" class="w-full bg-[#0c0806] border border-[#453026] rounded-lg px-4 py-2.5 text-sm text-[#f5f0eb] placeholder:text-gray-400 focus:outline-none focus:border-[#fbbf24] transition-colors font-medium" />
                                </div>
                                <div>
                                    <label class="text-xs uppercase tracking-wider text-[#f5f0eb] font-bold block mb-1.5">Security Token (Password)</label>
                                    <input type="password" required placeholder="••••••••••••" class="w-full bg-[#0c0806] border border-[#453026] rounded-lg px-4 py-2.5 text-sm text-[#f5f0eb] placeholder:text-gray-400 focus:outline-none focus:border-[#fbbf24] transition-colors" />
                                </div>
                                <div class="flex flex-col gap-3 pt-3">
                                    <button type="submit" class="w-full py-3 bg-[#fbbf24] hover:bg-[#d9a21b] text-[#0c0806] rounded-lg font-bold text-xs uppercase tracking-widest transition-all shadow-md">
                                        Validate Access Token
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>`;
                lucide.createIcons();
                return;
            }

            // --- PLATFORM BASE STRUCTURAL HOUSING ---
            app.innerHTML = `
                <header class="sticky top-0 z-50 bg-[#16100d]/95 backdrop-blur-md border-b border-[#2d201a] px-6 py-4 flex justify-between items-center shadow-lg">
                    <div onclick="navigateTo('FEED')" class="flex items-center gap-3 cursor-pointer group">
                        <i data-lucide="coffee" class="w-5 h-5 text-[#fbbf24] group-hover:rotate-12 transition-transform"></i>
                        <span class="text-lg font-bold tracking-wider uppercase text-[#fbbf24]">Anteiku Hub</span>
                    </div>
                    
                    <div class="flex items-center gap-5 relative">
                        <div class="relative">
                            <button onclick="state.isNotificationDropdownOpen=!state.isNotificationDropdownOpen; state.isCategoryDropdownOpen=false; render();" class="relative p-2 text-[#fbbf24] hover:text-white transition-colors rounded-lg hover:bg-[#231915]">
                                <i data-lucide="bell" class="w-5 h-5 text-[#fbbf24]"></i>
                                ${unreadCount > 0 ? `<span class="absolute top-1 right-1 bg-red-500 text-white text-[9px] font-bold h-4 w-4 rounded-full flex items-center justify-center border border-[#16100d] animate-pulse">${unreadCount}</span>` : ''}
                            </button>

                            <div class="absolute right-0 mt-3 w-80 bg-[#16100d] border border-[#2d201a] rounded-xl shadow-2xl overflow-hidden transition-all duration-200 z-[60] ${state.isNotificationDropdownOpen ? 'opacity-100 scale-100' : 'opacity-0 scale-95 pointer-events-none'}"">
                                <div class="p-3 bg-[#231915] border-b border-[#2d201a] flex justify-between items-center">
                                    <h4 class="text-xs uppercase tracking-widest font-bold text-[#fbbf24] flex items-center gap-1.5">
                                        <i data-lucide="activity" class="w-3.5 h-3.5 text-[#fbbf24]"></i> 
                                        Platform Live Alerts
                                    </h4>
                                    ${unreadCount > 0 ? `<button onclick="clearAllNotifications()" class="text-[10px] text-[#fbbf24] hover:underline uppercase font-bold tracking-wider">Flush</button>` : ''}
                                </div>
                                <div class="max-h-64 overflow-y-auto divide-y divide-[#231915]">
                                    ${state.notifications.map(n => `
                                        <div class="p-3.5 text-xs flex items-start gap-2.5 ${n.unread ? 'bg-[#231915]/40 border-l-2 border-[#fbbf24]' : ''}">
                                            <i data-lucide="${n.type === 'rating' ? 'coffee' : n.type === 'like' ? 'heart' : 'user-plus'}" class="w-4 h-4 mt-0.5 shrink-0 text-[#fbbf24]"></i>
                                            <p class="text-[#f5f0eb] font-light leading-relaxed">${n.message}</p>
                                        </div>`).join('')}
                                </div>
                            </div>
                        </div>

                        <button onclick="navigateTo('PROFILE')" class="text-xs tracking-wider uppercase font-bold text-[#fbbf24] hover:text-white border border-dashed border-[#453026] px-4 py-2 rounded-md hover:bg-[#231915] transition-all">
                            Edit Profile
                        </button>
                    </div>
                </header>

                <div class="flex flex-1 flex-col md:flex-row relative z-10">
                    <aside class="w-full md:w-64 bg-[#16100d]/90 backdrop-blur-sm border-b md:border-b-0 md:border-r border-[#2d201a] p-6 flex flex-col justify-between shrink-0 shadow-2xl">
                        <div class="space-y-2">
                            <p class="text-[10px] uppercase tracking-widest text-[#fbbf24] font-bold mb-4 px-3">Café Navigation Index</p>
                            <nav class="space-y-1">
                                <button onclick="navigateTo('FEED')" class="w-full flex items-center gap-4 px-4 py-3 rounded-lg text-sm font-semibold transition-all ${state.currentView==='FEED' ? 'bg-[#2d201a] text-[#fbbf24] border-l-2 border-[#fbbf24]' : 'text-[#f5f0eb] hover:bg-[#231915]'}"">
                                    <i data-lucide="compass" class="w-4 h-4 text-[#fbbf24]"></i> The Main Lounge
                                </button>
                                <button onclick="navigateTo('WRITE')" class="w-full flex items-center gap-4 px-4 py-3 rounded-lg text-sm font-semibold transition-all ${state.currentView==='WRITE' ? 'bg-[#2d201a] text-[#fbbf24] border-l-2 border-[#fbbf24]' : 'text-[#f5f0eb] hover:bg-[#231915]'}"">
                                    <i data-lucide="pen-tool" class="w-4 h-4 text-[#fbbf24]"></i> Write Article
                                </button>
                                <button onclick="navigateTo('ACCOUNT')" class="w-full flex items-center gap-4 px-4 py-3 rounded-lg text-sm font-semibold transition-all ${state.currentView==='ACCOUNT' ? 'bg-[#2d201a] text-[#fbbf24] border-l-2 border-[#fbbf24]' : 'text-[#f5f0eb] hover:bg-[#231915]'}"">
                                    <i data-lucide="shield-check" class="w-4 h-4 text-[#fbbf24]"></i> Account Management
                                </button>
                            </nav>
                        </div>
                        <div class="space-y-3 mt-6">
                            <div class="p-4 bg-[#0c0806] rounded-xl border border-[#2d201a] text-center">
                                <span class="text-[11px] text-[#f5f0eb]/70 block font-mono">Seat Allocation Handle:</span>
                                <span class="text-xs text-[#fbbf24] font-bold block mt-0.5">@${state.profile.username}</span>
                            </div>
                            <button onclick="handleSignOut()" class="w-full flex items-center justify-center gap-2 py-2 text-xs font-bold text-red-400 hover:text-red-300 hover:bg-red-950/20 rounded-lg transition-all border border-transparent hover:border-red-900/30">
                                <i data-lucide="log-out" class="w-3.5 h-3.5 text-red-400"></i> Clear Token Session (Logout)
                            </button>
                        </div>
                    </aside>

                    <main class="flex-1 p-5 md:p-8 max-w-5xl w-full mx-auto overflow-hidden animate-fadeIn" id="view-target"></main>
                </div>

                ${state.showRewardModal ? `
                <div class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/85 backdrop-blur-sm animate-fadeIn">
                    <div class="bg-[#16100d] border border-[#fbbf24] p-8 rounded-2xl max-w-sm w-full text-center space-y-5 shadow-2xl">
                        <div class="flex justify-center">
                            <div class="w-20 h-20 bg-[#231915] border border-[#fbbf24]/50 rounded-full flex items-center justify-center text-[#fbbf24] coffee-bounce shadow-lg shadow-[#fbbf24]/10">
                                <i data-lucide="cup-straw" class="w-10 h-10 text-[#fbbf24]"></i>
                            </div>
                        </div>
                        <div class="space-y-1">
                            <h3 class="text-xl font-bold tracking-wide text-[#fbbf24]">Thank you for supporting this writer! ☕</h3>
                            <p class="text-xs text-[#f5f0eb] font-serif italic">Here is a warm cup of coffee as appreciation.</p>
                        </div>
                        <button onclick="state.showRewardModal=false; state.selectedBeanRating=0; render();" class="w-full py-2.5 bg-[#fbbf24] hover:bg-[#d9a21b] text-[#0c0806] rounded-lg text-xs font-bold uppercase tracking-wider transition-colors shadow-md">Return to Table</button>

                ${state.customToast.show ? `

                    </div>
                </div>` : ''}`;

            const target = document.getElementById('view-target');

            // --- ROUTING MATRIX VIEW A: CENTRAL FEED LOUNGE ---
            if (state.currentView === 'FEED') {
                let dropdownMenuOptionsHtml = categories.map(c => `
                    <button onclick="state.activeFilter='${c.id}'; state.isCategoryDropdownOpen=false; render();"

                    </button>`).join('');

                let filtered = state.activeFilter === '#All' 
                    ? state.databaseArticles 
                    : state.databaseArticles.filter(a => a.category === state.activeFilter);

                let feedCardsHtml = filtered.map(art => `
                    <div onclick="state.selectedArticleId='${art.id}'; navigateTo('READER');" class="group bg-[#16100d]/90 backdrop-blur-sm border border-[#2d201a] p-6 rounded-xl hover:border-[#fbbf24]/40 transition-all duration-300 cursor-pointer flex flex-col justify-between shadow-md">
                        <div>
                            <div class="flex items-center gap-3 mb-3">
                                <span class="text-xs font-mono font-bold tracking-wider text-[#0c0806] bg-[#fbbf24] px-2.5 py-0.5 rounded">${art.category}</span>
                                <span class="text-xs text-gray-300 flex items-center gap-1">
                                    <i data-lucide="clock" class="w-3.5 h-3.5 text-[#fbbf24]"></i> ${art.readTime}
                                </span>
                                <span class="text-xs text-gray-300 ml-auto font-medium">By <b class="text-[#fbbf24]">${art.author}</b></span>
                            </div>
                            <h2 class="text-2xl font-bold mb-2 text-[#fbbf24] group-hover:text-white transition-colors">${art.title}</h2>
                            <p class="font-serif italic text-sm text-[#f5f0eb]/90 mb-3">${art.subtitle}</p>
                            <p class="text-sm text-[#f5f0eb] font-light leading-relaxed line-clamp-3">${art.body}</p>
                        </div>
                        <div class="mt-6 pt-4 border-t border-[#231915] flex justify-between items-center text-xs text-[#fbbf24] font-semibold tracking-wide uppercase">
                            <span class="group-hover:text-white flex items-center gap-1.5 transition-colors">
                                <i data-lucide="book-open" class="w-3.5 h-3.5 text-[#fbbf24]"></i> Pull Up Essay Text
                            </span>
                            <span class="text-gray-300 flex items-center gap-1 normal-case font-normal">
                                <i data-lucide="message-square" class="w-3.5 h-3.5 text-[#fbbf24]"></i> Comments Feed

                                <button onclick="state.isCategoryDropdownOpen=!state.isCategoryDropdownOpen; state.isNotificationDropdownOpen=false; render();"

                                    <i data-lucide="hash" class="w-3.5 h-3.5 text-[#fbbf24]"></i>
                                    <span>All Categories Dropdown: <span class="text-[#fbbf24] font-mono">${state.activeFilter}</span></span>

                                </button>
                                <div class="absolute left-0 mt-2 w-64 bg-[#16100d] border border-[#2d201a] rounded-xl shadow-2xl overflow-hidden transition-all duration-200 ${state.isCategoryDropdownOpen ? 'opacity-100 scale-100 animate-fadeIn' : 'opacity-0 scale-95 pointer-events-none'}"">
                                    ${dropdownMenuOptionsHtml}

                            </div>
                        </div>
                        <div class="grid grid-cols-1 gap-6 pt-1">${feedCardsHtml || '<div class="p-12 text-center text-gray-300 border border-dashed border-[#2d201a] rounded-xl font-serif italic text-sm">No recorded essays located inside this filter loop.</div>'}</div>
                    </div>`;
            }

            // --- ROUTING MATRIX VIEW B: EDIT PROFILE MODULE VIEW ---
            else if (state.currentView === 'PROFILE') {
                target.innerHTML = `
                    <div class="max-w-xl mx-auto py-2 space-y-8">
                        <h2 class="text-2xl font-bold tracking-wide uppercase border-b border-[#2d201a] pb-3 text-[#fbbf24]">Edit Profile Configuration</h2>
                        <form onsubmit="handleProfileSave(event)" class="space-y-5 bg-[#16100d] border border-[#2d201a] p-6 rounded-xl shadow-xl">
                            <div>
                                <label class="text-xs uppercase tracking-wider text-[#f5f0eb] font-bold block mb-1.5">Pen Pseudonym Identity Name</label>
                                <input type="text" id="edit-name" required value="${state.profile.name}" class="w-full bg-[#0c0806] border border-[#453026] rounded-lg px-4 py-2.5 text-sm text-[#f5f0eb] focus:outline-none focus:border-[#fbbf24] transition-colors font-medium" />
                            </div>
                            <div>
                                <label class="text-xs uppercase tracking-wider text-[#f5f0eb] font-bold block mb-1.5">User Handle Parameter Prefix (@)</label>
                                <div class="relative flex items-center">

                                    <input type="text" id="edit-username" required value="${state.profile.username}" class="w-full bg-[#0c0806] border border-[#453026] rounded-lg pl-9 pr-4 py-2.5 text-sm text-[#f5f0eb] font-mono focus:outline-none focus:border-[#fbbf24] transition-colors" />

                            </div>
                            <div>
                                <label class="text-xs uppercase tracking-wider text-[#f5f0eb] font-bold block mb-1.5">Author Biography Narrative Text</label>
                                <textarea id="edit-bio" rows="3" class="w-full bg-[#0c0806] border border-[#453026] rounded-lg px-4 py-2.5 text-sm text-[#f5f0eb] focus:outline-none focus:border-[#fbbf24] resize-none leading-relaxed font-light">${state.profile.bio}</textarea>

                            <button type="submit" class="w-full py-3 bg-[#fbbf24] hover:bg-[#d9a21b] text-[#0c0806] rounded-lg font-bold text-xs uppercase tracking-wider transition-all mt-1">Commit System Profile Parameters</button>

                target.innerHTML = `

                                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                                    ${['Gaming', 'Sports', 'Education', 'News', 'GeneralKnowledge'].map(cat => `
                                        <label class="flex items-center gap-2.5 p-2.5 bg-[#0c0806] border rounded-lg cursor-pointer transition-colors ${state.writerSelectedCategory===cat?'border-[#fbbf24] bg-[#231915]':'border-[#3c2a22]'}"">
                                            <input type="radio" name="w-cat" value="${cat}" ${state.writerSelectedCategory===cat?'checked':''} onchange="state.writerSelectedCategory='${cat}'; render();" class="accent-[#fbbf24]"/>

                                        </label>`).join('')}
                                </div>
                            </div>

                            <div class="space-y-4 pt-1">
                                <input type="text" id="w-title" placeholder="Title your long-form composition narrative..." class="w-full bg-transparent border-b border-[#2d201a] pb-3 text-3xl font-bold font-serif text-[#f5f0eb] focus:outline-none focus:border-[#fbbf24] placeholder:text-gray-500" />
                                <input type="text" id="w-subtitle" placeholder="Add an elegant editorial subtitle summary..." class="w-full bg-transparent border-b border-[#2d201a] pb-2 text-sm font-serif italic text-[#f5f0eb]/80 focus:outline-none focus:border-[#2d201a] placeholder:text-gray-500" />
                                <textarea id="w-body" rows="10" placeholder="Begin weaving your analytical thoughts into paragraphs..." class="w-full bg-[#16100d] border border-[#2d201a] rounded-xl p-5 text-sm text-[#f5f0eb] leading-relaxed focus:outline-none focus:border-[#fbbf24] resize-none placeholder:text-gray-500"></textarea>
                            </div>

                            <div class="flex justify-end gap-3">
                                <button onclick="navigateTo('FEED')" class="px-5 py-2.5 rounded-lg border border-[#2d201a] text-xs font-bold text-[#f5f0eb] hover:bg-[#16100d] transition-all">Discard Working Draft</button>
                                <button onclick="handlePublishArticle(event)" class="px-6 py-2.5 bg-[#fbbf24] hover:bg-[#d9a21b] text-[#0c0806] text-xs font-bold rounded-lg tracking-wider uppercase transition-all">Publish Content Node</button>
                            </div>
                        </div>

                        <aside class="bg-[#16100d] border border-[#2d201a] rounded-xl p-4 flex flex-col h-[560px] justify-between shadow-2xl">
                            <div class="space-y-3 flex flex-col h-full overflow-hidden">
                                <h3 class="text-sm font-bold text-[#fbbf24] flex items-center gap-2 border-b border-[#2d201a] pb-2 shrink-0">
                                    <i data-lucide="sparkles" class="w-4 h-4 text-[#fbbf24]"></i> 
                                    AI Barista Prompt Engine
                                </h3>
                                <div id="chat-scroll-pane" class="flex-1 overflow-y-auto space-y-3 pr-1 pb-1">${chatHistoryHtml}</div>
                            </div>
                            <div class="pt-3 border-t border-[#2d201a] flex gap-2 shrink-0">
                                <input type="text" id="ai-chat-input" placeholder="e.g., give me a FIFA World Cup idea..." onkeydown="if(event.key==='Enter') handleSendAiPrompt();" class="flex-1 bg-[#0c0806] border border-[#453026] rounded-lg px-3 py-2.5 text-xs text-[#f5f0eb] focus:outline-none focus:border-[#fbbf24] placeholder:text-gray-500" />
                                <button onclick="handleSendAiPrompt();" class="p-2.5 bg-[#fbbf24] hover:bg-[#d9a21b] text-[#0c0806] rounded-lg transition-colors shadow-md">
                                    <i data-lucide="send" class="w-4 h-4 text-[#0c0806]"></i>
                                </button>
                            </div>
                        </aside>
                    </div>`;
                
                const pane = document.getElementById('chat-scroll-pane');
                if(pane) pane.scrollTop = pane.scrollHeight;
            }

            // --- ROUTING MATRIX VIEW D: NARRATIVE ARTICLE READER VIEW ---
            else if (state.currentView === 'READER') {
                const targetEssay = state.databaseArticles.find(a => a.id === state.selectedArticleId) || state.databaseArticles[0];
                let beansHtml = '';
                for (let i = 1; i <= 5; i++) {
                    beansHtml += `
                        <button onclick="state.selectedBeanRating=${i}; render();" class="p-1 focus:outline-none group">
                            <i data-lucide="coffee" class="w-6 h-6 transition-transform group-active:scale-90 ${i <= state.selectedBeanRating ? 'text-[#fbbf24] fill-[#fbbf24]' : 'text-[#3c2a22]'}""></i>
                        </button>`;
                }

                target.innerHTML = `
                    <div class="grid grid-cols-1 lg:grid-cols-4 gap-8 items-start">
                        <div class="lg:col-span-3 space-y-6 bg-[#16100d]/60 backdrop-blur-sm border border-[#2d201a] p-6 md:p-8 rounded-2xl shadow-xl">
                            <div class="space-y-2">
                                <span class="text-xs font-mono font-bold tracking-wider text-[#0c0806] bg-[#fbbf24] px-2.5 py-0.5 rounded inline-block">${targetEssay.category}</span>
                                <h1 class="text-3xl md:text-4xl font-bold leading-tight text-[#fbbf24]">${targetEssay.title}</h1>
                                <p class="font-serif italic text-md text-[#f5f0eb]/90">${targetEssay.subtitle}</p>
                                <p class="text-xs text-gray-300 pt-1">Logged Creator Account: <b class="text-[#fbbf24] font-semibold">${targetEssay.author}</b></p>
                            </div>
                            <hr class="border-[#2d201a]" />
                            <div class="text-base text-[#f5f0eb] font-light space-y-5 leading-relaxed">
                                <p class="whitespace-pre-line">${targetEssay.body}</p>
                            </div>

                            <div class="mt-10 p-5 bg-[#16100d] border border-[#2d201a] rounded-xl space-y-4 shadow-inner">
                                <div class="space-y-1">
                                    <h4 class="text-xs uppercase tracking-wider font-bold text-[#f5f0eb]">Appreciation Evaluation Matrix</h4>
                                    <p class="text-[11px] text-gray-300">Assign an operational rating scale point. 4-5 star designations dispatch virtual coffee tokens instantly to the writer profile logs.</p>
                                </div>
                                <div class="flex items-center gap-1">${beansHtml}</div>
                                <button onclick="handleRatingSubmission();" class="mt-2 px-5 py-2.5 bg-[#fbbf24] hover:bg-[#d9a21b] text-[#0c0806] text-xs font-bold uppercase tracking-wider rounded-lg transition-all shadow-md flex items-center gap-2"><i data-lucide="award" class="w-3.5 h-3.5 text-[#0c0806]"></i> Submit Evaluation Metric</button>
                            </div>
                        </div>

                        <aside class="bg-[#16100d] border border-[#2d201a] rounded-xl p-5 space-y-4 shadow-xl">
                            <h3 class="text-sm font-bold text-[#fbbf24] flex items-center gap-2 border-b border-[#2d201a] pb-2"><i data-lucide="music" class="w-4 h-4 text-[#fbbf24]"></i> Ambient Channels</h3>
                            <div class="space-y-2">
                                ${['Vinyl Dust Drips', 'Rain Deck Arrays'].map(track => `
                                    <div class="flex justify-between items-center p-3 bg-[#0c0806] border border-[#2d201a] rounded-xl shadow-md">
                                        <span class="text-xs font-medium text-[#f5f0eb]">${track}</span>
                                        <button class="p-1.5 bg-[#16100d] hover:bg-[#2d201a] rounded-md text-[#fbbf24] transition-colors border border-[#2d201a]"><i data-lucide="play" class="w-3.5 h-3.5 text-[#fbbf24]"></i></button>
                                    </div>`).join('')}
                            </div>
                        </aside>
                    </div>`;
            }

            // --- ROUTING MATRIX VIEW E: PROFILE ACCOUNT CREATOR DASHBOARD ---
            else if (state.currentView === 'ACCOUNT') {
                let personalArticles = state.databaseArticles.filter(a => a.author === state.profile.name);
                let personalPostsGridHtml = personalArticles.map(p => `
                    <div class="p-5 bg-[#0c0806] border border-[#2d201a] rounded-xl shadow-md space-y-2 relative group hover:border-[#fbbf24]/50 transition-all">
                        <div class="flex justify-between items-center">
                            <span class="text-[10px] font-mono bg-[#231915] text-[#fbbf24] px-2 py-0.5 rounded border border-[#3c2a22]">${p.category}</span>
                            <span class="text-[11px] text-gray-300">${p.readTime}</span>
                        </div>
                        <h4 class="text-lg font-bold text-[#fbbf24] font-serif leading-tight group-hover:text-white transition-colors">${p.title}</h4>
                        <p class="text-xs text-[#f5f0eb]/70 font-serif italic">${p.subtitle}</p>
                        <p class="text-xs text-[#f5f0eb] line-clamp-2 pt-1 font-light leading-relaxed">${p.body}</p>
                        <div class="pt-2 flex gap-3">
                            <button onclick="state.selectedArticleId='${p.id}'; navigateTo('READER');" class="text-[11px] uppercase tracking-wider font-bold text-[#fbbf24] hover:underline flex items-center gap-1"><i data-lucide="eye" class="w-3 h-3 text-[#fbbf24]"></i> Inspect Document</button>
                        </div>
                    </div>`).join('');

                target.innerHTML = `
                    <div class="space-y-8">
                        <div class="border-b border-[#2d201a] pb-2 flex gap-4">
                            <button class="px-4 py-2 border-b-2 border-[#fbbf24] text-sm font-bold uppercase tracking-wider text-[#fbbf24]">My Account Dashboard</button>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                            <div class="bg-[#16100d] border border-[#2d201a] p-5 rounded-xl shadow-md flex items-center gap-4">
                                <div class="p-3 bg-[#231915] rounded-lg text-[#fbbf24] border border-[#3c2a22]"><i data-lucide="users" class="w-6 h-6 text-[#fbbf24]"></i></div>
                                <div>
                                    <span class="text-xs text-gray-400 block font-mono">Total Followers Count</span>
                                    <b class="text-2xl font-bold text-white tracking-wide">${state.profile.followers} Readers</b>
                                </div>
                            </div>
                            <div class="bg-[#16100d] border border-[#2d201a] p-5 rounded-xl shadow-md flex items-center gap-4">
                                <div class="p-3 bg-[#231915] rounded-lg text-[#fbbf24] border border-[#3c2a22]"><i data-lucide="layers" class="w-6 h-6 text-[#fbbf24]"></i></div>
                                <div>
                                    <span class="text-xs text-gray-400 block font-mono">Published Ledger Items</span>
                                    <b class="text-2xl font-bold text-white tracking-wide">${personalArticles.length} Posts</b>
                                </div>
                            </div>
                            <div class="bg-[#16100d] border border-[#2d201a] p-5 rounded-xl shadow-md flex items-center gap-4">
                                <div class="p-3 bg-[#231915] rounded-lg text-[#fbbf24] border border-[#3c2a22]"><i data-lucide="award" class="w-6 h-6 text-[#fbbf24]"></i></div>
                                <div>
                                    <span class="text-xs text-gray-400 block font-mono">Syndication Status</span>
                                    <b class="text-sm uppercase tracking-wider font-bold text-[#fbbf24] block mt-1">Verified Café Resident</b>
                                </div>
                            </div>
                        </div>

                        <div class="bg-[#16100d] border border-[#2d201a] p-6 rounded-xl shadow-xl space-y-4">
                            <div class="flex justify-between items-center border-b border-[#2d201a] pb-3">
                                <h3 class="text-md font-bold tracking-wider uppercase text-[#fbbf24] flex items-center gap-2"><i data-lucide="folder-git" class="w-4 h-4 text-[#fbbf24]"></i> Custom Published Articles Ledger</h3>
                                <button onclick="navigateTo('WRITE')" class="px-3 py-1 bg-[#fbbf24] hover:bg-[#d9a21b] text-[#0c0806] text-xs font-bold rounded flex items-center gap-1 uppercase tracking-wide"><i data-lucide="plus" class="w-3.5 h-3.5 text-[#0c0806]"></i> Fresh Drip</button>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-1">
                                ${personalPostsGridHtml || '<div class="col-span-2 p-8 text-center text-xs text-gray-400 italic border border-dashed border-[#2d201a] rounded-xl">No published text narratives associated with this profile allocation code block.</div>'}
                            </div>
                        </div>
                    </div>`;
            }

            // Re-call Lucide dynamic asset compiler node to finalize icon injection paths
            lucide.createIcons();
        }

        // --- PLATFORM ENGINE INSTANTIATION EXECUTOR ---
        render();
    </script>
</body>
</html>
