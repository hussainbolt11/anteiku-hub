<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anteiku Hub - Digital Literary Café</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght=500;700&family=Inter:wght=300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            /* SMOKY BACKGROUND GRADIENT */
            background: radial-gradient(circle at 50% 40%, #16110f 0%, #0c0806 70%);
            background-color: #0c0806; 
            color: #f5f0eb; 
            font-family: 'Inter', sans-serif; 
        }
        h1, h2, h3, h4, h5, h6, .cafe-header { 
            font-family: 'Cinzel', serif; 
            color: #fbbf24; 
        }
        
        /* Espresso Theme Custom Scrollbar Overrides */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #16100d; }
        ::-webkit-scrollbar-thumb { background: #453026; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #fbbf24; }
        
        /* Hardware Accelerated UI Animations */
        .animate-fadeIn {
            animation: fadeIn 0.2s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98) translateY(4px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes wavy-smoke-drift {
            0% { transform: translateY(100vh) translateX(0) scaleX(1); opacity: 0; }
            10% { opacity: 0.04; }
            40% { transform: translateY(50vh) translateX(25px) scaleX(1.2); opacity: 0.05; }
            70% { transform: translateY(20vh) translateX(-20px) scaleX(0.9); opacity: 0.02; }
            100% { transform: translateY(-20vh) translateX(10px) scaleX(1.1); opacity: 0; }
        }

        .steam-line {
            position: absolute;
            bottom: 0;
            fill: none;
            stroke: #fbbf24; 
            stroke-width: 2;
            stroke-linecap: round;
            opacity: 0;
            pointer-events: none;
            will-change: transform, opacity;
        }

        .steam-1 { left: 25%; animation: wavy-smoke-drift 14s infinite linear; }
        .steam-2 { left: 55%; animation: wavy-smoke-drift 18s infinite linear; animation-delay: 4s; }
        .steam-3 { left: 78%; animation: wavy-smoke-drift 16s infinite linear; animation-delay: 8s; }
    </style>
</head>
<body class="min-h-screen relative overflow-x-hidden select-none">

    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0" aria-hidden="true">
        <svg class="steam-line steam-1" width="60" height="200" viewBox="0 0 60 200"><path d="M30,200 C45,150 15,100 30,50 C45,0 30,-50 30,-100" /></svg>
        <svg class="steam-line steam-2" width="60" height="200" viewBox="0 0 60 200"><path d="M30,200 C15,160 45,120 30,80 C15,40 35,0 30,-40" /></svg>
        <svg class="steam-line steam-3" width="60" height="200" viewBox="0 0 60 200"><path d="M30,200 C50,140 20,90 35,40 C50,-10 25,-40 30,-90" /></svg>
    </div>

    <div id="app" class="min-h-screen flex flex-col relative z-10"></div>

    <script>
        // 1. FORCE HARDCODED DATA DIRECTLY IN RENDERING STATE
        const DEFAULT_LOUNGE_POSTS = [
            { 
                id: 'lounge-post-gaming', 
                title: 'The Future of Virtual Arenas: Next-Gen Gameplay Design', 
                content: 'Competitive environment engineering is shifting rapidly toward complex dynamic physics engines. Designers are stripping back structural visual clutter to focus completely on responsive spatial mastery. This mechanical friction creates a profound layer of depth that changes how professional players interact with digital landscapes.', 
                author: 'Café Creator', 
                handle: '@cafe_writer',
                category: '#Gaming', 
                readTime: '4 min read',
                likes: 12,
                rating: 5
            },
            { 
                id: 'lounge-post-sports', 
                title: 'Geometric Strategies: Spatial Architecture on the Pitch', 
                content: 'Modern tactical setups are structured like living, evolving algorithms moving across turf boundaries. Teams are prioritizing compact zonal blocks over simple athletic pacing to limit transition options. True tactical superiority belongs to squads that manipulate micro-spaces and transition lines in high-stress matches.', 
                author: 'Café Creator', 
                handle: '@cafe_writer',
                category: '#Sports', 
                readTime: '4 min read',
                likes: 12,
                rating: 5
            },
            { 
                id: 'lounge-post-education', 
                title: 'Midnight Ink: The Structural Friction of Deep Focus', 
                content: 'Acquiring complex cognitive structures requires intentional slow-form study models that challenge fast-paced data delivery. True intellectual retention manifests when an individual steps entirely away from algorithmic summaries into deep reading blocks. This deliberate mental workout builds analytical clarity that quick-scrolling media simply cannot replicate.', 
                author: 'Café Creator', 
                handle: '@cafe_writer',
                category: '#Education', 
                readTime: '4 min read',
                likes: 12,
                rating: 5
            },
            { 
                id: 'lounge-post-news', 
                title: 'The Velocity of Digital Broadcast Networks', 
                content: 'Rapid-fire real-time update patterns often distort complete contextual truths across global communication layers. Returning to curated, verified editorial analysis shields institutional health from sudden informational spikes and emotional distribution engines. Protecting civil clarity requires a focused structural transition back toward verified deep investigative prints.', 
                author: 'Café Creator', 
                handle: '@cafe_writer',
                category: '#News', 
                readTime: '4 min read',
                likes: 12,
                rating: 5
            },
            { 
                id: 'lounge-post-knowledge', 
                title: 'The Fluid Mechanics of Espresso Alchemy', 
                content: 'Extracting premium organic coffee compounds under precise thermal dynamics is a meticulous physical science experiment. Factors such as water mineral balance, grind profiles, and constant atmospheric pressures dictate extraction yields and fluid behavior. Adjusting these chemical boundaries preserves the delicate balance between bitter tannins and structural aromatic clarity.', 
                author: 'Café Creator', 
                handle: '@cafe_writer',
                category: '#GeneralKnowledge', 
                readTime: '4 min read',
                likes: 12,
                rating: 5
            }
        ];

        const defaultCafeAvatars = [
            "https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&q=80&w=120&h=120",
            "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&q=80&w=120&h=120",
            "https://images.unsplash.com/photo-1507133750040-4a8f57021571?auto=format&fit=crop&q=80&w=120&h=120",
            "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&q=80&w=120&h=120"
        ];

        // --- CORE APPLICATION STATE ENGINE ---
        function bootstrapCoreEngine() {
            const isAuth = localStorage.getItem('anteiku_authenticated') === 'true';
            const currentEmail = localStorage.getItem('anteiku_current_email') || '';
            const emailKey = sanitizeEmailKey(currentEmail);
            
            const isOnboarded = localStorage.getItem(`anteiku_onboarded_${emailKey}`) === 'true';
            const savedProfile = localStorage.getItem(`anteiku_profile_${emailKey}`);
            
            const profile = savedProfile ? JSON.parse(savedProfile) : {
                name: 'Guest Writer',
                username: '',
                avatar: defaultCafeAvatars[0],
                bio: 'Writing from the corner booth.',
                followers: 0
            };

            // 2. BYPASS THE EMPTY CHECK WITH AUTOMATIC FALLBACK
            const savedArticles = localStorage.getItem('anteiku_articles');
            let articles = [];
            if (savedArticles) {
                try {
                    const parsed = JSON.parse(savedArticles);
                    if (parsed && parsed.length > 0) {
                        articles = parsed;
                    } else {
                        articles = [...DEFAULT_LOUNGE_POSTS];
                    }
                } catch(e) {
                    articles = [...DEFAULT_LOUNGE_POSTS];
                }
            } else {
                articles = [...DEFAULT_LOUNGE_POSTS];
            }
            localStorage.setItem('anteiku_articles', JSON.stringify(articles));

            let notifications = [];
            if (isAuth && currentEmail) {
                const savedNotifications = localStorage.getItem(`anteiku_notifications_${emailKey}`);
                notifications = savedNotifications ? JSON.parse(savedNotifications) : [];
            }

            return {
                isAuthenticated: isAuth,
                currentEmail: currentEmail,
                showOnboardingModal: isAuth && !isOnboarded,
                currentView: isAuth && isOnboarded ? 'FEED' : (isAuth ? 'ONBOARDING' : 'LANDING'),
                profile: profile,
                databaseArticles: articles,
                notifications: notifications,
                activeFilter: '#All',
                isCategoryDropdownOpen: false,
                isNotificationDropdownOpen: false,
                writerSelectedCategory: 'Gaming',
                customToast: { show: false, title: '', message: '' },
                
                isEditProfilePanelOpen: false,
                editProfileNameValue: profile.name || '',
                editProfileBioValue: profile.bio || '',
                editProfileAvatarValue: profile.avatar || defaultCafeAvatars[0],
                editCustomAvatarSelected: false,

                onboardingNameValue: profile.name || '',
                onboardingUsernameValue: profile.username || ''
            };
        }

        function sanitizeEmailKey(email) {
            if (!email) return 'default';
            return email.toLowerCase().replace(/[^a-z0-9]/g, '_');
        }

        let state = bootstrapCoreEngine();

        const categories = [
            { id: '#All', label: 'All Categories', tag: '#All' },
            { id: '#Gaming', label: 'Gaming', tag: '#Gaming' },
            { id: '#Sports', label: 'Sports', tag: '#Sports' },
            { id: '#Education', label: 'Education', tag: '#Education' },
            { id: '#News', label: 'News', tag: '#News' },
            { id: '#GeneralKnowledge', label: 'General Knowledge', tag: '#GeneralKnowledge' }
        ];

        function triggerInlineToast(title, message) {
            state.customToast = { show: true, title, message };
            render();
            setTimeout(() => {
                state.customToast.show = false;
                render();
            }, 4000);
        }

        function navigateTo(view) {
            if (!state.isAuthenticated) {
                state.currentView = 'LANDING';
            } else if (state.showOnboardingModal) {
                state.currentView = 'ONBOARDING';
            } else {
                state.currentView = view;
            }
            state.isCategoryDropdownOpen = false;
            state.isNotificationDropdownOpen = false;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function handleSignIn(e) {
            if (e) e.preventDefault();
            const emailInput = document.querySelector('input[type="email"]').value.trim();
            
            state.isAuthenticated = true;
            state.currentEmail = emailInput;
            localStorage.setItem('anteiku_authenticated', 'true');
            localStorage.setItem('anteiku_current_email', emailInput);

            const emailKey = sanitizeEmailKey(emailInput);
            const isOnboarded = localStorage.getItem(`anteiku_onboarded_${emailKey}`) === 'true';
            
            const savedProfile = localStorage.getItem(`anteiku_profile_${emailKey}`);
            if (savedProfile) {
                state.profile = JSON.parse(savedProfile);
            } else {
                state.profile = {
                    name: 'Guest Writer',
                    username: '',
                    avatar: defaultCafeAvatars[0],
                    bio: 'Writing from the corner booth.',
                    followers: 0
                };
            }

            const savedNotifications = localStorage.getItem(`anteiku_notifications_${emailKey}`);
            state.notifications = savedNotifications ? JSON.parse(savedNotifications) : [];

            state.onboardingNameValue = state.profile.name || '';
            state.onboardingUsernameValue = state.profile.username || '';
            
            state.editProfileNameValue = state.profile.name || '';
            state.editProfileBioValue = state.profile.bio || '';
            state.editProfileAvatarValue = state.profile.avatar || defaultCafeAvatars[0];
            state.editCustomAvatarSelected = false;

            if (!isOnboarded) {
                state.showOnboardingModal = true;
                navigateTo('ONBOARDING');
            } else {
                state.showOnboardingModal = false;
                navigateTo('FEED');
                triggerInlineToast('Authorization Succeeded', 'Your table space token has been validated.');
            }
        }

        function liveCheckUsernameUniqueness(inputEl) {
            const rawVal = inputEl.value;
            const cleanedInput = rawVal.trim().replace('@', '').toLowerCase();
            state.onboardingUsernameValue = cleanedInput;

            const errorBox = document.getElementById('username-error-container');
            const submitBtn = document.getElementById('onboarding-submit-btn');
            const inputWrapper = document.getElementById('onboard-username');

            if (!cleanedInput) {
                errorBox.classList.add('hidden');
                inputWrapper.classList.remove('border-amber-500');
                inputWrapper.classList.add('border-[#453026]');
                submitBtn.disabled = true;
                return;
            }

            let matchesExisting = false;
            const currentEmailKey = sanitizeEmailKey(state.currentEmail);

            for (let i = 0; i < localStorage.length; i++) {
                const storageKey = localStorage.key(i);
                if (storageKey.startsWith('anteiku_profile_')) {
                    if (storageKey === `anteiku_profile_${currentEmailKey}`) continue;
                    try {
                        const parsedUser = JSON.parse(localStorage.getItem(storageKey));
                        if (parsedUser && parsedUser.username && parsedUser.username.toLowerCase() === cleanedInput) {
                            matchesExisting = true;
                            break;
                        }
                    } catch (e) {}
                }
            }

            if (matchesExisting) {
                errorBox.classList.remove('hidden');
                inputWrapper.classList.add('border-amber-500');
                inputWrapper.classList.remove('border-[#453026]');
                submitBtn.disabled = true;
                submitBtn.className = "w-full py-3 text-xs font-bold uppercase tracking-widest transition-all shadow-md flex items-center justify-center gap-2 rounded-lg bg-[#2d201a] text-gray-500 cursor-not-allowed border border-[#3c2a22]";
            } else {
                errorBox.classList.add('hidden');
                inputWrapper.classList.remove('border-amber-500');
                inputWrapper.classList.add('border-[#453026]');
                
                const currentNameInput = document.getElementById('onboard-name');
                if (currentNameInput && currentNameInput.value.trim()) {
                    submitBtn.disabled = false;
                    submitBtn.className = "w-full py-3 text-xs font-bold uppercase tracking-widest transition-all shadow-md flex items-center justify-center gap-2 rounded-lg bg-[#fbbf24] hover:bg-[#d9a21b] text-[#0c0806]";
                }
            }
        }

        function liveUpdateNameField(inputEl) {
            state.onboardingNameValue = inputEl.value;
            const usernameInput = document.getElementById('onboard-username');
            if (usernameInput) {
                liveCheckUsernameUniqueness(usernameInput);
            }
        }

        function handleOnboardingSubmission(e) {
            if (e) e.preventDefault();
            const chosenName = document.getElementById('onboard-name').value.trim();
            const chosenUsername = state.onboardingUsernameValue.trim();
            
            if (!chosenName || !chosenUsername) {
                triggerInlineToast('Validation Error', 'Fields cannot remain unwritten.');
                return;
            }

            let structuralCollision = false;
            const currentEmailKey = sanitizeEmailKey(state.currentEmail);
            for (let i = 0; i < localStorage.length; i++) {
                const storageKey = localStorage.key(i);
                if (storageKey.startsWith('anteiku_profile_')) {
                    if (storageKey === `anteiku_profile_${currentEmailKey}`) continue;
                    try {
                        const parsedUser = JSON.parse(localStorage.getItem(storageKey));
                        if (parsedUser && parsedUser.username && parsedUser.username.toLowerCase() === chosenUsername.toLowerCase()) {
                            structuralCollision = true;
                            break;
                        }
                    } catch (ex) {}
                }
            }

            if (structuralCollision) {
                triggerInlineToast('Validation Collision', 'This handle configuration is occupied.');
                return;
            }

            const emailKey = sanitizeEmailKey(state.currentEmail);
            
            state.profile.name = chosenName;
            state.profile.username = chosenUsername;
            state.profile.avatar = defaultCafeAvatars[0];
            
            localStorage.setItem(`anteiku_profile_${emailKey}`, JSON.stringify(state.profile));
            localStorage.setItem(`anteiku_onboarded_${emailKey}`, 'true');
            
            state.showOnboardingModal = false;
            state.editProfileNameValue = chosenName;
            state.editProfileAvatarValue = defaultCafeAvatars[0];

            executeIncomingNotificationSimulation('follower', null);
            triggerInlineToast('Profile Configured', 'Your workspace identity nodes have unified successfully.');
            navigateTo('FEED');
        }

        function handleUpdateProfileDashboard(e) {
            if (e) e.preventDefault();
            const emailKey = sanitizeEmailKey(state.currentEmail);
            
            state.profile.name = state.editProfileNameValue.trim() || state.profile.name;
            state.profile.bio = state.editProfileBioValue.trim();
            state.profile.avatar = state.editProfileAvatarValue;

            localStorage.setItem(`anteiku_profile_${emailKey}`, JSON.stringify(state.profile));

            state.isEditProfilePanelOpen = false;
            triggerInlineToast('Ledger Modified', 'Identity parameters updated gracefully across table arrays.');
            render();
        }

        function handleSignOut() {
            state.isAuthenticated = false;
            state.currentEmail = '';
            state.showOnboardingModal = false;
            localStorage.setItem('anteiku_authenticated', 'false');
            localStorage.setItem('anteiku_current_email', '');
            navigateTo('LANDING');
        }

        function executeIncomingNotificationSimulation(type, title) {
            let message = '';
            if (type === 'like') {
                message = `A customer liked your article '${title}'.`;
            } else {
                message = `A new reader started following your table. Welcome to the workspace, ${state.profile.name}!`;
                state.profile.followers += 1;
                const emailKey = sanitizeEmailKey(state.currentEmail);
                localStorage.setItem(`anteiku_profile_${emailKey}`, JSON.stringify(state.profile));
            }
            state.notifications.unshift({ id: Date.now(), type, message, unread: true });
            if (state.currentEmail) {
                localStorage.setItem(`anteiku_notifications_${sanitizeEmailKey(state.currentEmail)}`, JSON.stringify(state.notifications));
            }
        }

        function clearAllNotifications() {
            state.notifications = state.notifications.map(n => ({ ...n, unread: false }));
            if (state.currentEmail) {
                localStorage.setItem(`anteiku_notifications_${sanitizeEmailKey(state.currentEmail)}`, JSON.stringify(state.notifications));
            }
            render();
        }

        function handlePublishArticle(e) {
            if (e) e.preventDefault();
            const titleInput = document.getElementById('w-title').value.trim();
            const subtitleInput = document.getElementById('w-subtitle').value.trim();
            const bodyInput = document.getElementById('w-body').value.trim();
            
            if (!titleInput || !bodyInput) {
                triggerInlineToast('Validation Error', 'Fields cannot remain unwritten.');
                return;
            }

            const newPost = {
                id: String(Date.now()),
                title: titleInput,
                content: bodyInput,
                author: state.profile.name,
                handle: `@${state.profile.username}`,
                category: `#${state.writerSelectedCategory}`,
                readTime: `${Math.max(1, Math.ceil(bodyInput.split(' ').length / 160))} min read`,
                likes: 0,
                rating: 5
            };

            state.databaseArticles.unshift(newPost);
            localStorage.setItem('anteiku_articles', JSON.stringify(state.databaseArticles));
            
            executeIncomingNotificationSimulation('like', titleInput);
            triggerInlineToast('Article Synchronized', `Dispatched under ${newPost.category}.`);
            navigateTo('ACCOUNT');
        }

        // --- PLATFORM VIEW COMPILER ENGINE ---
        function render() {
            const app = document.getElementById('app');
            const unreadCount = state.notifications.filter(n => n.unread).length;

            if (!state.isAuthenticated || state.currentView === 'LANDING') {
                app.innerHTML = `
                    <div class="min-h-screen flex flex-col justify-center items-center p-4 relative">
                        <div class="max-w-md w-full space-y-6 z-10 animate-fadeIn bg-[#16100d] border border-[#3c2a22] p-8 rounded-2xl shadow-2xl">
                            <div class="text-center space-y-2">
                                <div class="flex justify-center mb-1">
                                    <div class="p-4 bg-[#231915] border border-[#523b30] rounded-full">
                                        <i data-lucide="coffee" class="w-10 h-10 text-[#fbbf24]"></i>
                                    </div>
                                </div>
                                <h1 class="text-4xl font-bold tracking-wide text-[#fbbf24]">Anteiku Hub</h1>
                                <p class="text-xs text-[#f5f0eb]/90">Sign-in credentials persist natively across reloads.</p>
                            </div>
                            <form onsubmit="handleSignIn(event)" class="space-y-4 pt-2">
                                <div>
                                    <label class="text-xs uppercase tracking-wider text-[#f5f0eb] font-bold block mb-1.5">Cafe ID (Email)</label>
                                    <input type="email" required placeholder="writer@anteiku.com" class="w-full bg-[#0c0806] border border-[#453026] rounded-lg px-4 py-2.5 text-sm text-[#f5f0eb] focus:outline-none focus:border-[#fbbf24]" />
                                </div>
                                <div>
                                    <label class="text-xs uppercase tracking-wider text-[#f5f0eb] font-bold block mb-1.5">Security Token</label>
                                    <input type="password" required placeholder="••••••••••••" class="w-full bg-[#0c0806] border border-[#453026] rounded-lg px-4 py-2.5 text-sm text-[#f5f0eb] focus:outline-none focus:border-[#fbbf24]" />
                                </div>
                                <button type="submit" class="w-full py-3 bg-[#fbbf24] hover:bg-[#d9a21b] text-[#0c0806] rounded-lg font-bold text-xs uppercase tracking-widest transition-all">Validate Access Token</button>
                            </form>
                        </div>
                    </div>`;
                lucide.createIcons();
                return;
            }

            if (state.currentView === 'ONBOARDING' || state.showOnboardingModal) {
                const isInitiallyEmpty = !state.onboardingUsernameValue || !state.onboardingNameValue;

                app.innerHTML = `
                    <div class="min-h-screen flex flex-col justify-center items-center p-4 relative">
                        <div class="max-w-md w-full space-y-5 z-10 animate-fadeIn bg-[#16100d] border border-[#fbbf24]/60 p-8 rounded-2xl shadow-2xl">
                            <div class="text-center space-y-1">
                                <h2 class="text-2xl font-bold tracking-wide text-[#fbbf24]">Welcome to the Café</h2>
                                <p class="text-xs text-[#f5f0eb]/80 font-light">Let's set up your table profile parameters.</p>
                            </div>

                            <form onsubmit="handleOnboardingSubmission(event)" class="space-y-4 pt-1">
                                <div>
                                    <label class="text-xs uppercase tracking-wider text-[#f5f0eb] font-bold block mb-1">Enter your Name</label>
                                    <input type="text" id="onboard-name" required value="${state.onboardingNameValue}" oninput="liveUpdateNameField(this)" placeholder="e.g. Ken Kaneki" class="w-full bg-[#0c0806] border border-[#453026] rounded-lg px-4 py-2 text-sm text-[#f5f0eb] focus:outline-none focus:border-[#fbbf24]" />
                                </div>
                                
                                <div>
                                    <label class="text-xs uppercase tracking-wider text-[#f5f0eb] font-bold block mb-1">Choose a Username (handle)</label>
                                    <div class="relative flex items-center">
                                        <span class="absolute left-4 text-sm font-bold font-mono text-[#fbbf24]">@</span>
                                        <input type="text" id="onboard-username" required value="${state.onboardingUsernameValue}" oninput="liveCheckUsernameUniqueness(this)" placeholder="books_and_brews" class="w-full bg-[#0c0806] border border-[#453026] rounded-lg pl-9 pr-4 py-2 text-sm text-[#f5f0eb] font-mono focus:outline-none transition-colors" />
                                    </div>
                                    <div id="username-error-container" class="mt-1.5 text-xs text-amber-400 font-medium flex items-center gap-1 hidden">
                                        <i data-lucide="alert-triangle" class="w-3.5 h-3.5"></i>
                                        <span>This username is already taken. Please choose a different handle.</span>
                                    </div>
                                </div>

                                <div class="pt-2">
                                    <button type="submit" id="onboarding-submit-btn" ${isInitiallyEmpty ? 'disabled' : ''} class="w-full py-3 text-xs font-bold uppercase tracking-widest transition-all shadow-md flex items-center justify-center gap-2 rounded-lg ${isInitiallyEmpty ? 'bg-[#2d201a] text-gray-500 cursor-not-allowed border border-[#3c2a22]' : 'bg-[#fbbf24] hover:bg-[#d9a21b] text-[#0c0806]'}"">
                                        Let's Go <i data-lucide="chevron-right" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>`;
                lucide.createIcons();
                const initUserEl = document.getElementById('onboard-username');
                if (initUserEl && initUserEl.value) {
                    liveCheckUsernameUniqueness(initUserEl);
                }
                return;
            }

            app.innerHTML = `
                <header class="sticky top-0 z-50 bg-[#16100d]/95 backdrop-blur-md border-b border-[#2d201a] px-6 py-3 flex justify-between items-center shadow-lg">
                    <div onclick="navigateTo('FEED')" class="flex items-center gap-3 cursor-pointer group">
                        <i data-lucide="coffee" class="w-5 h-5 text-[#fbbf24] group-hover:rotate-12 transition-transform"></i>
                        <span class="text-lg font-bold tracking-wider uppercase text-[#fbbf24]">Anteiku Hub</span>
                    </div>
                    
                    <div class="flex items-center gap-4 relative">
                        <div class="flex items-center gap-3 px-3 py-1 rounded-lg bg-[#231915] border border-[#2d201a]">
                            <img src="${state.profile.avatar || defaultCafeAvatars[0]}" alt="User Profile" class="w-7 h-7 rounded-md object-cover border border-[#453026]" />
                            <span class="text-xs font-mono font-medium text-[#fbbf24]">${state.profile.name} (@${state.profile.username})</span>
                        </div>

                        <div class="relative">
                            <button onclick="state.isNotificationDropdownOpen=!state.isNotificationDropdownOpen; state.isCategoryDropdownOpen=false; render();" class="relative p-2 text-[#fbbf24] rounded-lg hover:bg-[#231915]">
                                <i data-lucide="bell" class="w-5 h-5 text-[#fbbf24]"></i>
                                ${unreadCount > 0 ? `<span class="absolute top-1 right-1 bg-red-500 text-white text-[9px] font-bold h-4 w-4 rounded-full flex items-center justify-center border border-[#16100d]">${unreadCount}</span>` : ''}
                            </button>

                            <div class="absolute right-0 mt-3 w-80 bg-[#16100d] border border-[#2d201a] rounded-xl shadow-2xl overflow-hidden transition-all duration-200 z-[60] ${state.isNotificationDropdownOpen ? 'opacity-100 scale-100' : 'opacity-0 scale-95 pointer-events-none'}"">
                                <div class="p-3 bg-[#231915] border-b border-[#2d201a] flex justify-between items-center">
                                    <h4 class="text-xs uppercase tracking-widest font-bold text-[#fbbf24] flex items-center gap-1.5"><i data-lucide="activity" class="w-3.5 h-3.5"></i> Platform Live Alerts</h4>
                                    ${unreadCount > 0 ? `<button onclick="clearAllNotifications()" class="text-[10px] text-[#fbbf24] hover:underline uppercase font-bold tracking-wider">Flush</button>` : ''}
                                </div>
                                <div class="max-h-64 overflow-y-auto divide-y divide-[#231915]">
                                    ${state.notifications.length > 0 ? state.notifications.map(n => `
                                        <div class="p-3.5 text-xs flex items-start gap-2.5 ${n.unread ? 'bg-[#231915]/40 border-l-2 border-[#fbbf24]' : ''}">
                                            <i data-lucide="bell" class="w-4 h-4 mt-0.5 shrink-0 text-[#fbbf24]"></i>
                                            <p class="text-[#f5f0eb] font-light leading-relaxed">${n.message}</p>
                                        </div>`).join('') : `<div class="p-6 text-center text-xs text-gray-400 font-light italic">Your personal workspace is empty.</div>`}
                                </div>
                            </div>
                        </div>
                    </div>
                </header>

                <div class="flex flex-1 flex-col md:flex-row relative z-10">
                    <aside class="w-full md:w-64 bg-[#16100d]/90 backdrop-blur-sm border-b md:border-b-0 md:border-r border-[#2d201a] p-6 flex flex-col justify-between shrink-0 shadow-2xl">
                        <div class="space-y-4">
                            <p class="text-[10px] uppercase tracking-widest text-[#fbbf24] font-bold px-2">Café Navigation Index</p>
                            <nav class="space-y-1">
                                <button onclick="navigateTo('FEED')" class="w-full flex items-center gap-4 px-4 py-2.5 rounded-lg text-sm font-semibold transition-all ${state.currentView==='FEED' ? 'bg-[#2d201a] text-[#fbbf24] border-l-2 border-[#fbbf24]' : 'text-[#f5f0eb] hover:bg-[#231915]'}""><i data-lucide="compass" class="w-4 h-4 text-[#fbbf24]"></i> The Main Lounge</button>
                                <button onclick="navigateTo('WRITE')" class="w-full flex items-center gap-4 px-4 py-2.5 rounded-lg text-sm font-semibold transition-all ${state.currentView==='WRITE' ? 'bg-[#2d201a] text-[#fbbf24] border-l-2 border-[#fbbf24]' : 'text-[#f5f0eb] hover:bg-[#231915]'}""><i data-lucide="pen-tool" class="w-4 h-4 text-[#fbbf24]"></i> Write Article</button>
                                <button onclick="navigateTo('ACCOUNT')" class="w-full flex items-center gap-4 px-4 py-2.5 rounded-lg text-sm font-semibold transition-all ${state.currentView==='ACCOUNT' ? 'bg-[#2d201a] text-[#fbbf24] border-l-2 border-[#fbbf24]' : 'text-[#f5f0eb] hover:bg-[#231915]'}""><i data-lucide="shield-check" class="w-4 h-4 text-[#fbbf24]"></i> My Account</button>
                            </nav>
                        </div>
                        <div class="space-y-3 pt-6 border-t border-[#231915]">
                            <div class="flex items-center gap-3 p-2 bg-[#0c0806] rounded-xl border border-[#2d201a]">
                                <img src="${state.profile.avatar || defaultCafeAvatars[0]}" class="h-10 w-10 object-cover rounded-lg border border-[#453026]" alt="" />
                                <div class="overflow-hidden">
                                    <span class="text-xs text-white font-bold block truncate">${state.profile.name}</span>
                                    <span class="text-[10px] text-[#fbbf24] font-mono block truncate">@${state.profile.username}</span>
                                </div>
                            </div>
                            <button onclick="handleSignOut()" class="w-full flex items-center justify-center gap-2 py-2 text-xs font-bold text-red-400 hover:bg-red-950/20 rounded-lg border border-transparent transition-all"><i data-lucide="log-out" class="w-3.5 h-3.5"></i> Exit Session</button>
                        </div>
                    </aside>

                    <main class="flex-1 p-5 md:p-8 max-w-5xl w-full mx-auto overflow-hidden animate-fadeIn" id="view-target"></main>
                </div>

                ${state.customToast.show ? `
                <div class="fixed bottom-6 right-6 z-[120] max-w-sm w-full bg-[#16100d] border border-[#fbbf24]/40 p-4 rounded-xl shadow-2xl flex gap-3 items-start animate-fadeIn">
                    <div class="space-y-0.5 flex-1">
                        <h5 class="text-xs uppercase tracking-wider font-bold text-[#fbbf24]">${state.customToast.title}</h5>
                        <p class="text-xs text-[#f5f0eb] font-light leading-relaxed">${state.customToast.message}</p>
                    </div>
                </div>` : ''}`;

            const target = document.getElementById('view-target');

            // --- VIEW A: CENTRAL LOUNGE FEED ---
            if (state.currentView === 'FEED') {
                let dropdownMenuOptionsHtml = categories.map(c => `
                    <button onclick="state.activeFilter='${c.id}'; state.isCategoryDropdownOpen=false; render();" 
                        class="w-full text-left px-4 py-2.5 text-xs font-mono transition-colors flex justify-between items-center ${state.activeFilter === c.id ? 'bg-[#2d201a] text-[#fbbf24]' : 'text-[#f5f0eb] hover:bg-[#231915]'}"">
                        <span>${c.tag} <span class="text-[10px] text-gray-400 ml-1">(${c.label})</span></span>
                    </button>`).join('');

                // Ensure dynamic validation array safety mapping checks are handled smoothly
                let activeSource = (state.databaseArticles && state.databaseArticles.length > 0) 
                    ? state.databaseArticles 
                    : [...DEFAULT_LOUNGE_POSTS];

                let filtered = state.activeFilter === '#All' 
                    ? activeSource 
                    : activeSource.filter(a => a.category === state.activeFilter);

                // 3. MAP THE CARDS VISUALLY IN HIGH-CONTRAST AMBER YELLOW / STEAM WHITE
                let feedCardsHtml = filtered.map(art => {
                    const isCurrentUser = (art.author === state.profile.name);
                    const currentAvatar = isCurrentUser ? (state.profile.avatar || defaultCafeAvatars[0]) : defaultCafeAvatars[1];
                    const verifiedHandle = art.handle || '@cafe_writer';
                    
                    return `
                    <div class="bg-[#16100d]/90 backdrop-blur-sm border border-[#2d201a] p-6 rounded-xl hover:border-[#fbbf24]/40 transition-all duration-300 flex flex-col justify-between shadow-md">
                        <div>
                            <div class="flex items-center gap-3 mb-3.5">
                                <img src="${currentAvatar}" class="w-6 h-6 object-cover rounded border border-[#453026]" alt="" />
                                <span class="text-xs font-mono font-bold tracking-wider text-[#0c0806] bg-[#fbbf24] px-2.5 py-0.5 rounded">${art.category}</span>
                                <span class="text-xs text-gray-400 font-mono">${art.readTime}</span>
                                <span class="text-xs text-gray-300 ml-auto font-medium">
                                    By <span class="text-[#fbbf24] font-semibold">${art.author}</span> 
                                    <span class="text-gray-500 font-mono text-[11px]">(${verifiedHandle})</span>
                                </span>
                            </div>
                            <h2 class="text-xl font-bold mb-2.5 text-[#fbbf24] tracking-wide">${art.title}</h2>
                            <p class="text-sm text-[#f5f0eb] font-light leading-relaxed">${art.content || art.body}</p>
                            
                            <div class="flex items-center gap-4 mt-4 pt-3 border-t border-[#231915] text-[11px] text-gray-400 font-mono">
                                <span class="flex items-center gap-1 hover:text-amber-400 transition-colors cursor-pointer">
                                    <i data-lucide="heart" class="w-3.5 h-3.5 text-amber-500"></i> ${art.likes || 12} Likes
                                </span>
                                <span class="flex items-center gap-0.5 text-amber-400">
                                    ${Array(art.rating || 5).fill('<i data-lucide="star" class="w-3 h-3 fill-current"></i>').join('')}
                                </span>
                            </div>
                        </div>
                    </div>`;
                }).join('');

                target.innerHTML = `
                    <div class="space-y-6">
                        <div class="border-b border-[#2d201a] pb-4 flex items-center justify-between relative z-40">
                            <div class="relative">
                                <button onclick="state.isCategoryDropdownOpen=!state.isCategoryDropdownOpen; render();" 
                                    class="px-4 py-2 rounded-lg text-xs font-bold bg-[#16100d] text-[#f5f0eb] border border-[#2d201a] hover:border-[#fbbf24] flex items-center gap-2 transition-all">
                                    <span>Lounge Category: <span class="text-[#fbbf24] font-mono">${state.activeFilter}</span></span>
                                    <i data-lucide="chevron-down" class="w-3 h-3 text-[#fbbf24]"></i>
                                </button>
                                <div class="absolute left-0 mt-2 w-56 bg-[#16100d] border border-[#2d201a] rounded-xl shadow-2xl overflow-hidden transition-all duration-200 ${state.isCategoryDropdownOpen ? 'opacity-100 scale-100 animate-fadeIn' : 'opacity-0 scale-95 pointer-events-none'}"">
                                    ${dropdownMenuOptionsHtml}
                                </div>
                            </div>
                            <h3 class="text-sm font-bold tracking-widest text-[#fbbf24] uppercase font-serif">Central Review Desk</h3>
                        </div>
                        <div class="grid grid-cols-1 gap-6 pt-1">${feedCardsHtml || '<div class="p-8 text-center text-xs text-gray-400 italic">No matching records.</div>'}</div>
                    </div>`;
            }

            else if (state.currentView === 'WRITE') {
                target.innerHTML = `
                    <div class="space-y-5 max-w-2xl mx-auto">
                        <div class="bg-[#16100d] border border-[#2d201a] p-5 rounded-xl space-y-3">
                            <h3 class="text-xs uppercase tracking-wider font-bold text-[#f5f0eb]">Assign Article Catalog Stream</h3>
                            <div class="flex gap-2 flex-wrap">
                                ${['Gaming', 'Sports', 'Education', 'News', 'GeneralKnowledge'].map(cat => `
                                    <button onclick="state.writerSelectedCategory='${cat}'; render();" class="px-3 py-1.5 rounded-lg text-xs font-mono border ${state.writerSelectedCategory===cat?'border-[#fbbf24] bg-[#231915] text-[#fbbf24]':'border-[#3c2a22] text-gray-400'}"">#${cat}</button>
                                `).join('')}
                            </div>
                        </div>
                        <div class="space-y-4">
                            <input type="text" id="w-title" placeholder="Title your essay..." class="w-full bg-transparent border-b border-[#2d201a] pb-2 text-2xl font-bold text-[#f5f0eb] focus:outline-none focus:border-[#fbbf24]" />
                            <textarea id="w-body" rows="8" placeholder="Begin weaving your paragraphs..." class="w-full bg-[#16100d] border border-[#2d201a] rounded-xl p-4 text-sm text-[#f5f0eb] leading-relaxed focus:outline-none focus:border-[#fbbf24] resize-none"></textarea>
                        </div>
                        <div class="flex justify-end gap-3">
                            <button onclick="handlePublishArticle(event)" class="px-6 py-2 bg-[#fbbf24] hover:bg-[#d9a21b] text-[#0c0806] text-xs font-bold rounded-lg tracking-wider uppercase transition-all">Publish Content Node</button>
                        </div>
                    </div>`;
            }

            else if (state.currentView === 'ACCOUNT') {
                let personalArticles = state.databaseArticles.filter(a => a.author === state.profile.name);
                let dashboardCardsHtml = personalArticles.map(p => `
                    <div class="p-4 bg-[#0c0806] border border-[#2d201a] rounded-xl space-y-1">
                        <span class="text-[10px] font-mono text-[#fbbf24]">
                            <img src="${state.profile.avatar || defaultCafeAvatars[0]}" class="inline-block w-3.5 h-3.5 object-cover rounded mr-1" alt="" />
                            ${p.category}
                        </span>
                        <h4 class="text-md font-bold text-white">${p.title}</h4>
                        <p class="text-xs text-[#f5f0eb]/70 truncate">${p.content || p.body}</p>
                    </div>`).join('');

                let editAvatarGridHtml = defaultCafeAvatars.map((url, index) => {
                    const isSelected = !state.editCustomAvatarSelected && state.editProfileAvatarValue === url;
                    return `
                        <div onclick="state.editCustomAvatarSelected=false; state.editProfileAvatarValue='${url}'; render();" class="relative cursor-pointer rounded-xl overflow-hidden border-2 h-12 w-12 transition-all ${isSelected ? 'border-[#fbbf24] scale-105 shadow-md shadow-[#fbbf24]/20' : 'border-[#2d201a] opacity-60 hover:opacity-100'}">
                            <img src="${url}" alt="Selector ${index + 1}" class="w-full h-full object-cover" />
                        </div>`;
                }).join('');

                target.innerHTML = `
                    <div class="space-y-6 max-w-3xl mx-auto">
                        <div class="bg-[#16100d] border border-[#2d201a] p-6 rounded-2xl flex flex-col sm:flex-row items-center gap-5 shadow-xl">
                            <img src="${state.profile.avatar || defaultCafeAvatars[0]}" class="h-20 w-20 rounded-2xl object-cover border-2 border-[#fbbf24]/40 bg-[#0c0806]" alt="" />
                            <div class="space-y-1 text-center sm:text-left flex-1">
                                <div class="flex flex-col sm:flex-row items-center gap-2.5">
                                    <h2 class="text-2xl font-bold tracking-wide text-[#fbbf24]">${state.profile.name}</h2>
                                    <button onclick="state.isEditProfilePanelOpen=!state.isEditProfilePanelOpen; render();" class="px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider bg-[#231915] text-[#fbbf24] hover:bg-[#2d201a] border border-[#453026] rounded-md transition-all flex items-center gap-1">
                                        <i data-lucide="settings" class="w-3 h-3"></i> Edit Profile
                                    </button>
                                </div>
                                <p class="text-xs font-mono text-gray-400">Handle Reference: <span class="text-[#fbbf24]">@${state.profile.username}</span></p>
                                <p class="text-xs text-[#f5f0eb]/90 font-light pt-1">${state.profile.bio}</p>
                            </div>
                            <div class="px-4 py-2 bg-[#0c0806] rounded-xl border border-[#2d201a] text-center shrink-0">
                                <span class="text-xs text-gray-400 block font-mono">Followers</span>
                                <b class="text-xl font-bold text-[#fbbf24]">${state.profile.followers}</b>
                            </div>
                        </div>

                        ${state.isEditProfilePanelOpen ? `
                        <div class="bg-[#16100d] border border-[#fbbf24]/50 p-6 rounded-2xl space-y-4 animate-fadeIn">
                            <h3 class="text-xs uppercase tracking-wider font-bold text-[#fbbf24] flex items-center gap-2"><i data-lucide="user-cog" class="w-4 h-4"></i> Adjust Profile Settings</h3>
                            <form onsubmit="handleUpdateProfileDashboard(event)" class="space-y-4">
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div>
                                        <label class="text-[11px] uppercase tracking-wider text-gray-300 block mb-1 font-semibold">Change Display Name</label>
                                        <input type="text" value="${state.editProfileNameValue}" oninput="state.editProfileNameValue=this.value;" class="w-full bg-[#0c0806] border border-[#453026] rounded-lg px-3 py-2 text-xs text-[#f5f0eb] focus:outline-none focus:border-[#fbbf24]" />
                                    </div>
                                    <div>
                                        <label class="text-[11px] uppercase tracking-wider text-gray-300 block mb-1 font-semibold">Short Bio Description</label>
                                        <input type="text" value="${state.editProfileBioValue}" oninput="state.editProfileBioValue=this.value;" placeholder="Tell us about your desk..." class="w-full bg-[#0c0806] border border-[#453026] rounded-lg px-3 py-2 text-xs text-[#f5f0eb] focus:outline-none focus:border-[#fbbf24]" />
                                    </div>
                                </div>

                                <div class="bg-[#0c0806] p-4 rounded-xl border border-[#2d201a] space-y-3">
                                    <label class="text-xs uppercase tracking-wider text-[#fbbf24] font-bold block">Modify Profile Picture (PFP)</label>
                                    <div class="flex items-center gap-4">
                                        <div class="h-14 w-14 rounded-xl border-2 border-[#fbbf24]/40 overflow-hidden bg-[#16100d] shrink-0">
                                            <img id="edit-avatar-preview" src="${state.editProfileAvatarValue}" class="w-full h-full object-cover" alt="" />
                                        </div>
                                        <div class="flex gap-2 flex-wrap">${editAvatarGridHtml}</div>
                                    </div>
                                    <div class="pt-1">
                                        <span class="text-[10px] uppercase text-gray-400 block font-semibold mb-1">Or input custom external avatar link URL:</span>
                                        <input type="url" placeholder="https://example.com/custom-pfp.jpg" 
                                            value="${state.editCustomAvatarSelected ? state.editProfileAvatarValue : ''}"
                                            oninput="state.editCustomAvatarSelected=true; state.editProfileAvatarValue=this.value; document.getElementById('edit-avatar-preview').src=this.value;" 
                                            class="w-full bg-[#16100d] border border-[#453026] rounded-lg px-3 py-1.5 text-xs text-[#f5f0eb] focus:outline-none focus:border-[#fbbf24]" />
                                    </div>
                                </div>

                                <div class="flex justify-end gap-2 pt-1">
                                    <button type="button" onclick="state.isEditProfilePanelOpen=false; render();" class="px-4 py-2 text-xs font-bold uppercase text-gray-400 hover:text-white transition-colors">Cancel</button>
                                    <button type="submit" class="px-5 py-2 bg-[#fbbf24] hover:bg-[#d9a21b] text-[#0c0806] text-xs font-bold uppercase tracking-wider rounded-md shadow-md transition-all">Save Changes</button>
                                </div>
                            </form>
                        </div>` : ''}

                        <div class="bg-[#16100d] border border-[#2d201a] p-6 rounded-xl space-y-4">
                            <h3 class="text-xs uppercase tracking-wider font-bold text-[#fbbf24] border-b border-[#2d201a] pb-2">Your Published Literary Ledger Entries</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                ${dashboardCardsHtml || '<p class="text-xs text-gray-400 italic p-4">No content ledger entries published under this account token block.</p>'}
                            </div>
                        </div>
                    </div>`;
            }

            lucide.createIcons();
        }

        render();
    </script>
</body>
</html>
