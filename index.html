<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anteiku Hub | Read deeply, write freely.</title>
    <style>
        :root {
            --bg-dark: #0c0806;
            --bg-card: rgba(255, 255, 255, 0.03);
            --accent: #ffbf00;
            --text: #e5d3c0;
            --border: #332a26;
        }

        body {
            margin: 0;
            background: radial-gradient(circle at center, #16110f 0%, var(--bg-dark) 100%);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
        }

        /* UI Helpers */
        .hidden { display: none !important; }
        .card { background: var(--bg-card); border: 1px solid var(--border); padding: 20px; border-radius: 12px; }
        .accent-text { color: var(--accent); }

        /* Auth/Onboarding Containers */
        #auth-portal, #onboarding-modal {
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }

        /* Layout */
        #app-layout { display: flex; flex-direction: column; height: 100vh; }
        header { border-bottom: 1px solid var(--border); padding: 20px; display: flex; justify-content: space-between; }
        .main-content { display: flex; flex: 1; }
        aside { width: 200px; padding: 20px; }
        main { flex: 1; padding: 20px; }
    </style>
</head>
<body>

    <div id="auth-portal">
        <div class="card" style="width: 350px; text-align: center;">
            <h1>Anteiku Hub</h1>
            <p>Read deeply, write freely.</p>
            <input type="email" placeholder="Email Address" style="display:block; width:90%; margin:10px auto;"><br>
            <input type="password" placeholder="Password" style="display:block; width:90%; margin:10px auto;"><br>
            <button onclick="handleLogin()">Sign In</button>
        </div>
    </div>

    <div id="onboarding-modal" class="hidden">
        <form class="card" onsubmit="completeOnboarding(event)" style="width: 350px;">
            <h2>Welcome to Anteiku Hub</h2>
            <p>Let's set up your table.</p>
            <div id="error-msg" style="color: #ff4d4d;"></div>
            <input id="in-name" placeholder="Name" required style="width:100%; margin:10px 0;">
            <input id="in-handle" placeholder="Username (handle)" required style="width:100%; margin:10px 0;">
            <button type="submit">Start Hub</button>
        </form>
    </div>

    <div id="app-layout" class="hidden">
        <header>
            <div>
                <h2>Anteiku Hub</h2>
                <small class="accent-text">Read deeply, write freely.</small>
            </div>
            <div>
                <button>Edit Profile</button>
                <button onclick="signOut()">Sign Out</button>
            </div>
        </header>
        <div class="main-content">
            <aside>
                <div onclick="showTab('main')">Main Lounge</div>
                <div onclick="showTab('write')">Write Article</div>
                <div onclick="showTab('account')">Account Management</div>
            </aside>
            <main id="workspace">
                </main>
        </div>
    </div>

    <script>
        // State Management
        function handleLogin() {
            localStorage.setItem('user_session', 'active');
            document.getElementById('auth-portal').classList.add('hidden');
            document.getElementById('onboarding-modal').classList.remove('hidden');
        }

        function completeOnboarding(e) {
            e.preventDefault();
            const handle = document.getElementById('in-handle').value;
            const existing = JSON.parse(localStorage.getItem('all_handles') || '[]');
            
            if (existing.includes(handle)) {
                document.getElementById('error-msg').innerText = "This username is already taken. Please choose a different handle.";
                return;
            }

            localStorage.setItem('user_handle', handle);
            localStorage.setItem('all_handles', JSON.stringify([...existing, handle]));
            
            document.getElementById('onboarding-modal').classList.add('hidden');
            document.getElementById('app-layout').classList.remove('hidden');
            showTab('main');
        }

        function signOut() {
            localStorage.clear();
            location.reload();
        }

        function showTab(tab) {
            const workspace = document.getElementById('workspace');
            if(tab === 'main') {
                workspace.innerHTML = `<h3>Main Lounge</h3><p>Loading articles...</p>`;
            } else if(tab === 'write') {
                workspace.innerHTML = `<h3>Write Article</h3><input placeholder="Headline"><br><textarea placeholder="AI Barista prompts..."></textarea>`;
            } else {
                workspace.innerHTML = `<h3>Account Management</h3><p>Dashboard for ${localStorage.getItem('user_handle')}</p>`;
            }
        }

        // Initialize
        if(localStorage.getItem('user_session')) {
            document.getElementById('auth-portal').classList.add('hidden');
            document.getElementById('app-layout').classList.remove('hidden');
            showTab('main');
        }
    </script>
</body>
</html>
