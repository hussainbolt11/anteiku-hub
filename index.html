<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anteiku Hub - Digital Literary Café</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght=500;700&family=Inter:wght=300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            /* SMOKY BACKGROUND GRADIENT */
            background: radial-gradient(circle at 50% 40%, #16110f 0%, #0c0806 70%);
            background-color: #0c0806; 
            color: #f5f0eb; 
            font-family: 'Inter', sans-serif; 
        }
        h1, h2, h3, h4, h5, h6, .cafe-header { 
            font-family: 'Cinzel', serif; 
            color: #fbbf24; 
        }
        
        /* Espresso Theme Custom Scrollbar Overrides */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #16100d; }
        ::-webkit-scrollbar-thumb { background: #453026; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #fbbf24; }
        
        /* Hardware Accelerated UI Animations */
        .animate-fadeIn {
            animation: fadeIn 0.2s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98) translateY(4px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes bounceSlow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .coffee-bounce {
            animation: bounceSlow 2s infinite ease-in-out;
        }

        /* THE STEAM EFFECT & MOVEMENT RULES */
        @keyframes wavy-smoke-drift {
            0% {
                transform: translateY(100vh) translateX(0) scaleX(1);
                opacity: 0;
            }
            10% {
                opacity: 0.04;
            }
            40% {
                transform: translateY(50vh) translateX(25px) scaleX(1.2);
                opacity: 0.05;
            }
            70% {
                transform: translateY(20vh) translateX(-20px) scaleX(0.9);
                opacity: 0.02;
            }
            100% {
                transform: translateY(-20vh) translateX(10px) scaleX(1.1);
                opacity: 0;
            }
        }

        .steam-line {
            position: absolute;
            bottom: 0;
            fill: none;
            stroke: #fbbf24; /* Muted yellow/amber steam to cast a warm glow */
            stroke-width: 2;
            stroke-linecap: round;
            opacity: 0;
            pointer-events: none;
            will-change: transform, opacity;
        }

        .steam-1 {
            left: 25%;
            animation: wavy-smoke-drift 14s infinite linear;
        }
        .steam-2 {
            left: 55%;
            animation: wavy-smoke-drift 18s infinite linear;
            animation-delay: 4s;
        }
        .steam-3 {
            left: 78%;
            animation: wavy-smoke-drift 16s infinite linear;
            animation-delay: 8s;
        }
    </style>
</head>
<body class="min-h-screen relative overflow-x-hidden select-none">

    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0" aria-hidden="true">
        <svg class="steam-line steam-1" width="60" height="200" viewBox="0 0 60 200">
            <path d="M30,200 C45,150 15,100 30,50 C45,0 30,-50 30,-100" />
        </svg>
        <svg class="steam-line steam-2" width="60" height="200" viewBox="0 0 60 200">
            <path d="M30,200 C15,160 45,120 30,80 C15,40 35,0 30,-40" />
        </svg>
        <svg class="steam-line steam-3" width="60" height="200" viewBox="0 0 60 200">
            <path d="M30,200 C50,140 20,90 35,40 C50,-10 25,-40 30,-90" />
        </svg>
    </div>

    <div id="app" class="min-h-screen flex flex-col relative z-10"></div>

    <script>
        // --- FIXED SAMPLE REPOSITORY INITIALIZATION ---
        const hardcodedSampleArticles = [
            { 
                id: 'seed-gaming', 
                title: 'The Architecture of Virtual Solitude', 
                subtitle: 'Analyzing pacing, environmental design, and quiet structural ecosystems in modern open-world gaming.', 
                readTime: '9 min read', 
                category: '#Gaming', 
                author: 'Ken Kaneki', 
                body: 'To step inside a true virtual space is to accept an alternative pace. We dissect how minimal environments craft intentional narrative depth, pushing back against competitive metrics to cultivate personal headspace.' 
            },
            { 
                id: 'seed-sports', 
                title: 'The Analytical Mind on the Pitch', 
                subtitle: 'Tactical philosophy, geometric positioning, and the deep reading of space in athletics.', 
                readTime: '7 min read', 
                category: '#Sports', 
                author: 'Alex Thorne', 
                body: 'Modern sports setups mirror complex structural algorithms. Beyond physical execution lies a deep chess match written across manicured turf, prioritizing temporal mastery over brute physical acceleration.' 
            }
        ];

        // --- CORE APPLICATION STATE ENGINE ---
        function bootstrapCoreEngine() {
            const isAuth = localStorage.getItem('anteiku_authenticated') === 'true';
            const currentEmail = localStorage.getItem('anteiku_current_email') || '';
            
            const isOnboarded = localStorage.getItem(`anteiku_onboarded_${sanitizeEmailKey(currentEmail)}`) === 'true';

            const savedProfile = localStorage.getItem(`anteiku_profile_${sanitizeEmailKey(currentEmail)}`);
            const profile = savedProfile ? JSON.parse(savedProfile) : {
                name: 'Guest Writer',
                username: 'anonymous_brew',
                bio: 'Writing from the corner booth.',
                followers: 0
            };

            const savedArticles = localStorage.getItem('anteiku_articles');
            let articles = hardcodedSampleArticles;
            if (savedArticles) {
                try {
                    const parsed = JSON.parse(savedArticles);
                    if (parsed && parsed.length > 0) articles = parsed;
                } catch(e) {
                    articles = hardcodedSampleArticles;
                }
            }
            localStorage.setItem('anteiku_articles', JSON.stringify(articles));

            let notifications = [];
            if (isAuth && currentEmail) {
                const savedNotifications = localStorage.getItem(`anteiku_notifications_${sanitizeEmailKey(currentEmail)}`);
                notifications = savedNotifications ? JSON.parse(savedNotifications) : [];
            }

            return {
                isAuthenticated: isAuth,
                currentEmail: currentEmail,
                showOnboardingModal: isAuth && !isOnboarded,
                currentView: isAuth && isOnboarded ? 'FEED' : (isAuth ? 'ONBOARDING' : 'LANDING'),
                profile: profile,
                databaseArticles: articles,
                notifications: notifications,
                activeFilter: '#All',
                isCategoryDropdownOpen: false,
                isNotificationDropdownOpen: false,
                selectedBeanRating: 0,
                selectedArticleId: articles[0].id,
                writerSelectedCategory: 'Gaming',
                customToast: { show: false, title: '', message: '' },
                showRewardModal: false,
                
                // Onboarding UI Validation Helpers
                onboardingError: false,
                onboardingNameValue: '',
                onboardingUsernameValue: '',

                aiChatHistory: [
                    { sender: 'bot', text: 'Welcome back to the text refinery. Enter any subject parameters and I will provide talking blueprints.' }
                ]
            };
        }

        function sanitizeEmailKey(email) {
            if (!email) return 'default';
            return email.toLowerCase().replace(/[^a-z0-9]/g, '_');
        }

        let state = bootstrapCoreEngine();

        const categories = [
            { id: '#All', label: 'All Categories', tag: '#All' },
            { id: '#Gaming', label: 'Gaming', tag: '#Gaming' },
            { id: '#Sports', label: 'Sports', tag: '#Sports' }
        ];

        function triggerInlineToast(title, message) {
            state.customToast = { show: true, title, message };
            render();
            setTimeout(() => {
                state.customToast.show = false;
                render();
            }, 4000);
        }

        function navigateTo(view) {
            if (!state.isAuthenticated) {
                state.currentView = 'LANDING';
            } else if (state.showOnboardingModal) {
                state.currentView = 'ONBOARDING';
            } else {
                state.currentView = view;
            }
            state.isCategoryDropdownOpen = false;
            state.isNotificationDropdownOpen = false;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function handleSignIn(e) {
            if (e) e.preventDefault();
            const emailInput = document.querySelector('input[type="email"]').value.trim();
            
            state.isAuthenticated = true;
            state.currentEmail = emailInput;
            localStorage.setItem('anteiku_authenticated', 'true');
            localStorage.setItem('anteiku_current_email', emailInput);

            const emailKey = sanitizeEmailKey(emailInput);
            const isOnboarded = localStorage.getItem(`anteiku_onboarded_${emailKey}`) === 'true';
            
            const savedProfile = localStorage.getItem(`anteiku_profile_${emailKey}`);
            if (savedProfile) {
                state.profile = JSON.parse(savedProfile);
            } else {
                state.profile = {
                    name: 'Guest Writer',
                    username: '',
                    bio: 'Writing from the corner booth.',
                    followers: 0
                };
            }

            const savedNotifications = localStorage.getItem(`anteiku_notifications_${emailKey}`);
            state.notifications = savedNotifications ? JSON.parse(savedNotifications) : [];

            // Reset volatile validation buffers upon sign-in transit
            state.onboardingError = false;
            state.onboardingNameValue = state.profile.name || '';
            state.onboardingUsernameValue = state.profile.username || '';

            if (!isOnboarded) {
                state.showOnboardingModal = true;
                navigateTo('ONBOARDING');
            } else {
                state.showOnboardingModal = false;
                navigateTo('FEED');
                triggerInlineToast('Authorization Succeeded', 'Your table space token has been validated.');
            }
        }

        // UNIQUE CHECK LOGIC ENGINE
        function checkUsernameUniqueness(val) {
            const cleanedInput = val.trim().replace('@', '').toLowerCase();
            state.onboardingUsernameValue = cleanedInput;

            if (!cleanedInput) {
                state.onboardingError = false;
                render();
                return;
            }

            let matchesExisting = false;
            const currentEmailKey = sanitizeEmailKey(state.currentEmail);

            // Traverse localStorage records to inspect key profiles
            for (let i = 0; i < localStorage.length; i++) {
                const storageKey = localStorage.key(i);
                if (storageKey.startsWith('anteiku_profile_')) {
                    // Skip checking current user's profile if it was partially cached
                    if (storageKey === `anteiku_profile_${currentEmailKey}`) continue;

                    try {
                        const parsedUser = JSON.parse(localStorage.getItem(storageKey));
                        if (parsedUser && parsedUser.username && parsedUser.username.toLowerCase() === cleanedInput) {
                            matchesExisting = true;
                            break;
                        }
                    } catch (e) {
                        // Suppress corrupt parse files
                    }
                }
            }

            state.onboardingError = matchesExisting;
            render();
        }

        function handleOnboardingSubmission(e) {
            if (e) e.preventDefault();
            const chosenName = document.getElementById('onboard-name').value.trim();
            const chosenUsername = state.onboardingUsernameValue;

            if (state.onboardingError || !chosenName || !chosenUsername) {
                triggerInlineToast('Validation Error', 'Please clear outstanding conflicts before logging in.');
                return;
            }

            const emailKey = sanitizeEmailKey(state.currentEmail);
            
            state.profile.name = chosenName;
            state.profile.username = chosenUsername;
            
            localStorage.setItem(`anteiku_profile_${emailKey}`, JSON.stringify(state.profile));
            localStorage.setItem(`anteiku_onboarded_${emailKey}`, 'true');
            
            state.showOnboardingModal = false;
            executeIncomingNotificationSimulation('follower', null);

            triggerInlineToast('Profile Registered', 'Your unique table identifier has been secured.');
            navigateTo('FEED');
        }

        function handleSignOut() {
            state.isAuthenticated = false;
            state.currentEmail = '';
            state.showOnboardingModal = false;
            localStorage.setItem('anteiku_authenticated', 'false');
            localStorage.setItem('anteiku_current_email', '');
            navigateTo('LANDING');
        }

        function executeIncomingNotificationSimulation(type, title) {
            let message = '';
            if (type === 'like') {
                message = `A customer liked your article '${title}'.`;
            } else {
                message = `A new reader started following your table. Welcome, ${state.profile.name}!`;
                state.profile.followers += 1;
                const emailKey = sanitizeEmailKey(state.currentEmail);
                localStorage.setItem(`anteiku_profile_${emailKey}`, JSON.stringify(state.profile));
            }
            state.notifications.unshift({ id: Date.now(), type, message, unread: true });
            if (state.currentEmail) {
                localStorage.setItem(`anteiku_notifications_${sanitizeEmailKey(state.currentEmail)}`, JSON.stringify(state.notifications));
            }
        }

        function clearAllNotifications() {
            state.notifications = state.notifications.map(n => ({ ...n, unread: false }));
            if (state.currentEmail) {
                localStorage.setItem(`anteiku_notifications_${sanitizeEmailKey(state.currentEmail)}`, JSON.stringify(state.notifications));
            }
            render();
        }

        // --- PLATFORM VIEW COMPILER ENGINE ---
        function render() {
            const app = document.getElementById('app');
            const unreadCount = state.notifications.filter(n => n.unread).length;

            // --- SIGN-IN MODAL WALL CHECK ---
            if (!state.isAuthenticated || state.currentView === 'LANDING') {
                app.innerHTML = `
                    <div class="min-h-screen flex flex-col justify-center items-center p-4 relative">
                        <div class="max-w-md w-full space-y-6 z-10 animate-fadeIn bg-[#16100d] border border-[#3c2a22] p-8 rounded-2xl shadow-2xl">
                            <div class="text-center space-y-2">
                                <div class="flex justify-center mb-1">
                                    <div class="p-4 bg-[#231915] border border-[#523b30] rounded-full">
                                        <i data-lucide="coffee" class="w-10 h-10 text-[#fbbf24]"></i>
                                    </div>
                                </div>
                                <h1 class="text-4xl font-bold tracking-wide text-[#fbbf24]">Anteiku Hub</h1>
                                <p class="text-xs text-[#f5f0eb]/90 max-w-sm mx-auto font-light pt-1">Sign-in credentials persist natively across reloads.</p>
                            </div>
                            <form onsubmit="handleSignIn(event)" class="space-y-4 pt-2">
                                <div>
                                    <label class="text-xs uppercase tracking-wider text-[#f5f0eb] font-bold block mb-1.5">Cafe ID (Email)</label>
                                    <input type="email" required placeholder="writer@anteiku.com" class="w-full bg-[#0c0806] border border-[#453026] rounded-lg px-4 py-2.5 text-sm text-[#f5f0eb] focus:outline-none focus:border-[#fbbf24] transition-colors" />
                                </div>
                                <div>
                                    <label class="text-xs uppercase tracking-wider text-[#f5f0eb] font-bold block mb-1.5">Security Token</label>
                                    <input type="password" required placeholder="••••••••••••" class="w-full bg-[#0c0806] border border-[#453026] rounded-lg px-4 py-2.5 text-sm text-[#f5f0eb] focus:outline-none focus:border-[#fbbf24] transition-colors" />
                                </div>
                                <button type="submit" class="w-full py-3 bg-[#fbbf24] hover:bg-[#d9a21b] text-[#0c0806] rounded-lg font-bold text-xs uppercase tracking-widest transition-all shadow-md">Validate Access Token</button>
                            </form>
                        </div>
                    </div>`;
                lucide.createIcons();
                return;
            }

            // --- INTERCEPT MODAL VIEW: USER ONBOARDING WITH UNIQUENESS VALIDATION ---
            if (state.currentView === 'ONBOARDING' || state.showOnboardingModal) {
                const isFormInvalid = state.onboardingError || !state.onboardingUsernameValue || !state.onboardingNameValue;
                
                app.innerHTML = `
                    <div class="min-h-screen flex flex-col justify-center items-center p-4 relative">
                        <div class="max-w-md w-full space-y-6 z-10 animate-fadeIn bg-[#16100d] border ${state.onboardingError ? 'border-amber-500' : 'border-[#fbbf24]/60'} p-8 rounded-2xl shadow-2xl transition-colors duration-200">
                            <div class="text-center space-y-2">
                                <div class="flex justify-center mb-1">
                                    <div class="p-3.5 bg-[#231915] border border-[#fbbf24]/30 rounded-full text-[#fbbf24]">
                                        <i data-lucide="store" class="w-8 h-8 text-[#fbbf24]"></i>
                                    </div>
                                </div>
                                <h2 class="text-2xl font-bold tracking-wide text-[#fbbf24]">Welcome to the Café</h2>
                                <p class="text-sm text-[#f5f0eb]/90 font-light">Let's set up your table profile parameters.</p>
                            </div>

                            <form onsubmit="handleOnboardingSubmission(event)" class="space-y-4 pt-2">
                                <div>
                                    <label class="text-xs uppercase tracking-wider text-[#f5f0eb] font-bold block mb-1.5">Enter your Name</label>
                                    <input type="text" id="onboard-name" required value="${state.onboardingNameValue}" oninput="state.onboardingNameValue = this.value; render();" placeholder="e.g. Ken Kaneki" class="w-full bg-[#0c0806] border border-[#453026] rounded-lg px-4 py-2.5 text-sm text-[#f5f0eb] placeholder:text-gray-500 focus:outline-none focus:border-[#fbbf24] transition-colors font-medium" />
                                </div>
                                <div>
                                    <label class="text-xs uppercase tracking-wider text-[#f5f0eb] font-bold block mb-1.5">Choose a Username (handle)</label>
                                    <div class="relative flex items-center">
                                        <span class="absolute left-4 text-sm font-bold font-mono text-[#fbbf24]">@</span>
                                        <input type="text" id="onboard-username" required value="${state.onboardingUsernameValue}" oninput="checkUsernameUniqueness(this.value)" placeholder="books_and_brews" class="w-full bg-[#0c0806] border ${state.onboardingError ? 'border-amber-500 focus:border-amber-500' : 'border-[#453026] focus:border-[#fbbf24]'} rounded-lg pl-9 pr-4 py-2.5 text-sm text-[#f5f0eb] font-mono placeholder:text-gray-500 focus:outline-none transition-colors" />
                                    </div>
                                    
                                    ${state.onboardingError ? `
                                    <div class="mt-2 text-xs text-amber-400 font-medium tracking-wide flex items-center gap-1 animate-fadeIn">
                                        <i data-lucide="alert-triangle" class="w-3.5 h-3.5 stroke-2"></i>
                                        <span>This username is already taken. Please choose a different handle.</span>
                                    </div>` : ''}
                                </div>
                                <div class="pt-2">
                                    <button type="submit" ${isFormInvalid ? 'disabled' : ''} class="w-full py-3 text-xs font-bold uppercase tracking-widest transition-all shadow-md flex items-center justify-center gap-2 rounded-lg ${isFormInvalid ? 'bg-[#2d201a] text-gray-500 cursor-not-allowed border border-[#3c2a22]' : 'bg-[#fbbf24] hover:bg-[#d9a21b] text-[#0c0806]'}"">
                                        Let's Go <i data-lucide="chevron-right" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>`;
                lucide.createIcons();
                return;
            }

            // --- PLATFORM BASE STRUCTURAL HOUSING ---
            app.innerHTML = `
                <header class="sticky top-0 z-50 bg-[#16100d]/95 backdrop-blur-md border-b border-[#2d201a] px-6 py-4 flex justify-between items-center shadow-lg">
                    <div onclick="navigateTo('FEED')" class="flex items-center gap-3 cursor-pointer group">
                        <i data-lucide="coffee" class="w-5 h-5 text-[#fbbf24] group-hover:rotate-12 transition-transform"></i>
                        <span class="text-lg font-bold tracking-wider uppercase text-[#fbbf24]">Anteiku Hub</span>
                    </div>
                    
                    <div class="flex items-center gap-5 relative">
                        <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-[#231915] border border-[#2d201a]">
                            <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                            <span class="text-xs font-mono font-medium text-[#fbbf24]">${state.profile.name} (@${state.profile.username})</span>
                        </div>

                        <div class="relative">
                            <button onclick="state.isNotificationDropdownOpen=!state.isNotificationDropdownOpen; state.isCategoryDropdownOpen=false; render();" class="relative p-2 text-[#fbbf24] hover:text-white transition-colors rounded-lg hover:bg-[#231915]">
                                <i data-lucide="bell" class="w-5 h-5 text-[#fbbf24]"></i>
                                ${unreadCount > 0 ? `<span class="absolute top-1 right-1 bg-red-500 text-white text-[9px] font-bold h-4 w-4 rounded-full flex items-center justify-center border border-[#16100d]">${unreadCount}</span>` : ''}
                            </button>

                            <div class="absolute right-0 mt-3 w-80 bg-[#16100d] border border-[#2d201a] rounded-xl shadow-2xl overflow-hidden transition-all duration-200 z-[60] ${state.isNotificationDropdownOpen ? 'opacity-100 scale-100' : 'opacity-0 scale-95 pointer-events-none'}"">
                                <div class="p-3 bg-[#231915] border-b border-[#2d201a] flex justify-between items-center">
                                    <h4 class="text-xs uppercase tracking-widest font-bold text-[#fbbf24] flex items-center gap-1.5"><i data-lucide="activity" class="w-3.5 h-3.5"></i> Platform Live Alerts</h4>
                                    ${unreadCount > 0 ? `<button onclick="clearAllNotifications()" class="text-[10px] text-[#fbbf24] hover:underline uppercase font-bold tracking-wider">Flush</button>` : ''}
                                </div>
                                <div class="max-h-64 overflow-y-auto divide-y divide-[#231915]">
                                    ${state.notifications.length > 0 ? state.notifications.map(n => `
                                        <div class="p-3.5 text-xs flex items-start gap-2.5 ${n.unread ? 'bg-[#231915]/40 border-l-2 border-[#fbbf24]' : ''}">
                                            <i data-lucide="bell" class="w-4 h-4 mt-0.5 shrink-0 text-[#fbbf24]"></i>
                                            <p class="text-[#f5f0eb] font-light coding-relaxed">${n.message}</p>
                                        </div>`).join('') : `<div class="p-6 text-center text-xs text-gray-400 font-light italic">Your personal workspace is empty.</div>`}
                                </div>
                            </div>
                        </div>
                        <button onclick="navigateTo('FEED')" class="text-xs tracking-wider uppercase font-bold text-[#fbbf24] border border-dashed border-[#453026] px-4 py-2 rounded-md hover:bg-[#231915] transition-all">Lounge</button>
                    </div>
                </header>

                <div class="flex flex-1 flex-col md:flex-row relative z-10">
                    <aside class="w-full md:w-64 bg-[#16100d]/90 backdrop-blur-sm border-b md:border-b-0 md:border-r border-[#2d201a] p-6 flex flex-col justify-between shrink-0 shadow-2xl">
                        <nav class="space-y-1">
                            <button onclick="navigateTo('FEED')" class="w-full flex items-center gap-4 px-4 py-3 rounded-lg text-sm font-semibold transition-all ${state.currentView==='FEED' ? 'bg-[#2d201a] text-[#fbbf24] border-l-2 border-[#fbbf24]' : 'text-[#f5f0eb] hover:bg-[#231915]'}""><i data-lucide="compass" class="w-4 h-4 text-[#fbbf24]"></i> The Main Lounge</button>
                        </nav>
                        <button onclick="handleSignOut()" class="w-full flex items-center justify-center gap-2 py-2 text-xs font-bold text-red-400 hover:text-red-300 hover:bg-red-950/20 rounded-lg transition-all border border-transparent hover:border-red-900/30"><i data-lucide="log-out" class="w-3.5 h-3.5"></i> Exit Session</button>
                    </aside>

                    <main class="flex-1 p-5 md:p-8 max-w-5xl w-full mx-auto overflow-hidden animate-fadeIn" id="view-target"></main>
                </div>

                ${state.customToast.show ? `
                <div class="fixed bottom-6 right-6 z-[120] max-w-sm w-full bg-[#16100d] border border-[#fbbf24]/40 p-4 rounded-xl shadow-2xl flex gap-3 items-start animate-fadeIn">
                    <div class="space-y-0.5 flex-1">
                        <h5 class="text-xs uppercase tracking-wider font-bold text-[#fbbf24]">${state.customToast.title}</h5>
                        <p class="text-xs text-[#f5f0eb] font-light leading-relaxed">${state.customToast.message}</p>
                    </div>
                </div>` : ''}`;

            const target = document.getElementById('view-target');

            if (state.currentView === 'FEED') {
                let feedCardsHtml = state.databaseArticles.map(art => `
                    <div class="bg-[#16100d]/90 backdrop-blur-sm border border-[#2d201a] p-6 rounded-xl hover:border-[#fbbf24]/40 transition-all duration-300 flex flex-col justify-between shadow-md">
                        <div>
                            <div class="flex items-center gap-3 mb-3">
                                <span class="text-xs font-mono font-bold tracking-wider text-[#0c0806] bg-[#fbbf24] px-2.5 py-0.5 rounded">${art.category}</span>
                                <span class="text-xs text-gray-300 ml-auto font-medium">By <b class="text-[#fbbf24]">${art.author}</b></span>
                            </div>
                            <h2 class="text-2xl font-bold mb-2 text-[#fbbf24]">${art.title}</h2>
                            <p class="text-sm text-[#f5f0eb] font-light leading-relaxed">${art.body}</p>
                        </div>
                    </div>`).join('');

                target.innerHTML = `<div class="grid grid-cols-1 gap-6 pt-1">${feedCardsHtml}</div>`;
            }

            lucide.createIcons();
        }

        render();
    </script>
</body>
</html>
