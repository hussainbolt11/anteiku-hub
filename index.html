<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anteiku Hub - Read deeply, write freely.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght=500;700&family=Inter:wght=300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            /* DEEP ESPRESSO GRADIENT BACKGROUND */
            background: radial-gradient(circle at 50% 40%, #16110f 0%, #0c0806 70%);
            background-color: #0c0806; 
            color: #f5f0eb; 
            font-family: 'Inter', sans-serif; 
        }
        h1, h2, h3, h4, h5, h6, .cafe-header { 
            font-family: 'Cinzel', serif; 
            color: #fbbf24; 
        }
        
        /* Espresso Theme Custom Scrollbar Overrides */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #16100d; }
        ::-webkit-scrollbar-thumb { background: #453026; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #fbbf24; }
        
        /* Hardware Accelerated UI Animations */
        .animate-fadeIn {
            animation: fadeIn 0.2s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98) translateY(4px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        
        /* ANIMATED RISING STEAM LINES DESIGN ELEMENT */
        @keyframes wavy-smoke-drift {
            0% { transform: translateY(100vh) translateX(0) scaleX(1); opacity: 0; }
            10% { opacity: 0.04; }
            40% { transform: translateY(50vh) translateX(25px) scaleX(1.2); opacity: 0.05; }
            70% { transform: translateY(20vh) translateX(-20px) scaleX(0.9); opacity: 0.02; }
            100% { transform: translateY(-20vh) translateX(10px) scaleX(1.1); opacity: 0; }
        }

        .steam-line {
            position: absolute;
            bottom: 0;
            fill: none;
            stroke: #fbbf24; 
            stroke-width: 2;
            stroke-linecap: round;
            opacity: 0;
            pointer-events: none;
            will-change: transform, opacity;
        }

        .steam-1 { left: 25%; animation: wavy-smoke-drift 14s infinite linear; }
        .steam-2 { left: 55%; animation: wavy-smoke-drift 18s infinite linear; animation-delay: 4s; }
        .steam-3 { left: 78%; animation: wavy-smoke-drift 16s infinite linear; animation-delay: 8s; }
    </style>
</head>
<body class="min-h-screen relative overflow-x-hidden select-none">

    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0" aria-hidden="true">
        <svg class="steam-line steam-1" width="60" height="200" viewBox="0 0 60 200"><path d="M30,200 C45,150 15,100 30,50 C45,0 30,-50 30,-100" /></svg>
        <svg class="steam-line steam-2" width="60" height="200" viewBox="0 0 60 200"><path d="M30,200 C15,160 45,120 30,80 C15,40 35,0 30,-40" /></svg>
        <svg class="steam-line steam-3" width="60" height="200" viewBox="0 0 60 200"><path d="M30,200 C50,140 20,90 35,40 C50,-10 25,-40 30,-90" /></svg>
    </div>

    <div id="app" class="min-h-screen flex flex-col relative z-10"></div>

    <script>
        // CORE DATABASE LOUNGE STREAM ENTRIES
        const DEFAULT_LOUNGE_POSTS = [
            { 
                id: 'lounge-post-gaming', 
                title: 'The Future of Virtual Arenas: Next-Gen Gameplay Design', 
                content: 'Competitive environment engineering is shifting rapidly toward complex dynamic physics engines. Designers are stripping back structural visual clutter to focus completely on responsive spatial mastery. This mechanical friction creates a profound layer of depth that changes how professional players interact with digital landscapes.', 
                author: 'Café Creator', 
                handle: '@cafe_writer',
                category: '#Gaming', 
                image: 'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&q=80&w=600&h=300',
                likes: 12,
                rating: 5
            },
            { 
                id: 'lounge-post-sports', 
                title: 'Geometric Strategies: Spatial Architecture on the Pitch', 
                content: 'Modern tactical setups are structured like living, evolving algorithms moving across turf boundaries. Teams are prioritizing compact zonal blocks over simple athletic pacing to limit transition options. True tactical superiority belongs to squads that manipulate micro-spaces and transition lines in high-stress matches.', 
                author: 'Café Creator', 
                handle: '@cafe_writer',
                category: '#Sports', 
                image: 'https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&q=80&w=600&h=300',
                likes: 19,
                rating: 4
            },
            { 
                id: 'lounge-post-education', 
                title: 'Midnight Ink: The Structural Friction of Deep Focus', 
                content: 'Acquiring complex cognitive structures requires intentional slow-form study models that challenge fast-paced data delivery. True intellectual retention manifests when an individual steps entirely away from algorithmic summaries into deep reading blocks. This deliberate mental workout builds analytical clarity that quick-scrolling media simply cannot replicate.', 
                author: 'Café Creator', 
                handle: '@cafe_writer',
                category: '#Education', 
                image: 'https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?auto=format&fit=crop&q=80&w=600&h=300',
                likes: 31,
                rating: 5
            },
            { 
                id: 'lounge-post-news', 
                title: 'The Velocity of Digital Broadcast Networks', 
                content: 'Rapid-fire real-time update patterns often distort complete contextual truths across global communication layers. Returning to curated, verified editorial analysis shields institutional health from sudden informational spikes and emotional distribution engines. Protecting civil clarity requires a focused structural transition back toward verified deep investigative prints.', 
                author: 'Café Creator', 
                handle: '@cafe_writer',
                category: '#News', 
                image: 'https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&q=80&w=600&h=300',
                likes: 15,
                rating: 3
            },
            { 
                id: 'lounge-post-knowledge', 
                title: 'The Fluid Mechanics of Espresso Alchemy', 
                content: 'Extracting premium organic coffee compounds under precise thermal dynamics is a meticulous physical science experiment. Factors such as water mineral balance, grind profiles, and constant atmospheric pressures dictate extraction yields and fluid behavior. Adjusting these chemical boundaries preserves the delicate balance between bitter tannins and structural aromatic clarity.', 
                author: 'Café Creator', 
                handle: '@cafe_writer',
                category: '#GeneralKnowledge', 
                image: 'https://images.unsplash.com/photo-1511920170033-f8396924c348?auto=format&fit=crop&q=80&w=600&h=300',
                likes: 42,
                rating: 5
            }
        ];

        const defaultCafeAvatars = [
            "https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&q=80&w=120&h=120",
            "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&q=80&w=120&h=120",
            "https://images.unsplash.com/photo-1507133750040-4a8f57021571?auto=format&fit=crop&q=80&w=120&h=120",
            "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&q=80&w=120&h=120"
        ];

        // CATEGORIES SELECTION CONFIGURATION INCLUDING "ALL CATEGORIES"
        const categories = [
            { id: '#All', label: 'All Categories', tag: '#All' },
            { id: '#Gaming', label: 'Gaming', tag: '#Gaming' },
            { id: '#Sports', label: 'Sports', tag: '#Sports' },
            { id: '#Education', label: 'Education', tag: '#Education' },
            { id: '#News', label: 'News', tag: '#News' },
            { id: '#GeneralKnowledge', label: 'General Knowledge', tag: '#GeneralKnowledge' }
        ];

        function sanitizeEmailKey(email) {
            if (!email) return 'default';
            return email.toLowerCase().replace(/[^a-z0-9]/g, '_');
        }

        // --- PLATFORM CORE DATA STATE ENGINE ---
        function bootstrapCoreEngine() {
            const isAuth = localStorage.getItem('anteiku_authenticated') === 'true';
            const currentEmail = localStorage.getItem('anteiku_current_email') || '';
            const emailKey = sanitizeEmailKey(currentEmail);
            
            const isOnboarded = localStorage.getItem(`anteiku_onboarded_${emailKey}`) === 'true';
            const savedProfile = localStorage.getItem(`anteiku_profile_${emailKey}`);
            
            const profile = savedProfile ? JSON.parse(savedProfile) : {
                name: 'Guest Writer',
                username: 'guest_writer',
                avatar: defaultCafeAvatars[0],
                bio: 'Writing from the corner booth.',
                followers: 0
            };

            const savedArticles = localStorage.getItem('anteiku_articles');
            let articles = [];
            if (savedArticles) {
                try {
                    const parsed = JSON.parse(savedArticles);
                    articles = (parsed && parsed.length > 0) ? parsed : [...DEFAULT_LOUNGE_POSTS];
                } catch(e) {
                    articles = [...DEFAULT_LOUNGE_POSTS];
                }
            } else {
                articles = [...DEFAULT_LOUNGE_POSTS];
            }
            localStorage.setItem('anteiku_articles', JSON.stringify(articles));

            // LOAD LIKED TRACKING PERSISTENCE FROM SYSTEM LEDGER
            let likedArticles = [];
            const savedLikes = localStorage.getItem(`anteiku_liked_${emailKey}`);
            if (savedLikes) {
                try { likedArticles = JSON.parse(savedLikes); } catch(e) { likedArticles = []; }
            }

            // EXTRACTION UTILITIES FOR SOCIAL HOOKS SYSTEM (SAVES & FOLLOWS SYSTEM STATE)
            let savedArticlesList = [];
            const savedStore = localStorage.getItem(`anteiku_saved_${emailKey}`);
            if (savedStore) {
                try { savedArticlesList = JSON.parse(savedStore); } catch(e) { savedArticlesList = []; }
            }

            let followedArticlesList = [];
            const followedStore = localStorage.getItem(`anteiku_followed_${emailKey}`);
            if (followedStore) {
                try { followedArticlesList = JSON.parse(followedStore); } catch(e) { followedArticlesList = []; }
            }

            return {
                isAuthenticated: isAuth,
                currentEmail: currentEmail,
                showOnboardingModal: isAuth && !isOnboarded,
                currentView: isAuth && isOnboarded ? 'FEED' : (isAuth ? 'ONBOARDING' : 'LANDING'),
                profile: profile,
                databaseArticles: articles,
                likedArticleIds: likedArticles,
                savedArticleIds: savedArticlesList,        // Tracks saved user index pointers
                followedArticleIds: followedArticlesList,  // Tracks followed thread options
                
                // ROUTING SYSTEM EXTENSION FOR INDIVIDUAL NODES
                selectedArticleId: null,
                
                // ACTIVE FILTER STATE - DEFAULTS TO #All
                activeFilter: '#All',
                
                // TRENDING SORT ATOM STATE
                isTrendingSorted: false,
                
                isCategoryDropdownOpen: false,
                writerSelectedCategory: 'Gaming',
                customToast: { show: false, message: '' },
                
                // Overlay Configuration Form Values
                isEditProfileModalOpen: false,
                editProfileNameValue: profile.name || '',
                editProfileUsernameValue: profile.username || '',
                editProfileBioValue: profile.bio || '',
                editProfileAvatarValue: profile.avatar || defaultCafeAvatars[0],
                editCustomAvatarSelected: false,

                onboardingNameValue: profile.name || '',
                onboardingUsernameValue: profile.username || ''
            };
        }

        let state = bootstrapCoreEngine();

        // THE BARISTA APPRECIATION POP-UP TOAST METHOD
        function triggerBaristaAppreciation() {
            state.customToast = { show: true, message: "The Barista appreciates your rating! ☕✨" };
            render();
            if (window.toastTimer) clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => {
                state.customToast.show = false;
                render();
            }, 3500);
        }

        function triggerCustomToast(msg) {
            state.customToast = { show: true, message: msg };
            render();
            if (window.toastSystemTimer) clearTimeout(window.toastSystemTimer);
            window.toastSystemTimer = setTimeout(() => {
                state.customToast.show = false;
                render();
            }, 3000);
        }

        function navigateTo(view) {
            if (!state.isAuthenticated) {
                state.currentView = 'LANDING';
            } else if (state.showOnboardingModal) {
                state.currentView = 'ONBOARDING';
            } else {
                state.currentView = view;
            }
            state.selectedArticleId = null;
            state.isCategoryDropdownOpen = false;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // GLOBAL CLICK HANDLER LOOKUP BY UNIQUE ID STRING PRODUCER
        function viewArticleNodeDetails(articleId) {
            state.selectedArticleId = String(articleId);
            state.currentView = 'ARTICLE_VIEW';
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // STATE CONTROLLER FIX: ONE LIKE PER USER SYSTEM CAPABILITY
        function handleLikeArticle(e, articleId) {
            if (e) e.stopPropagation(); 
            const targetId = String(articleId);
            const emailKey = sanitizeEmailKey(state.currentEmail);
            
            const hasLiked = state.likedArticleIds.includes(targetId);
            
            if (hasLiked) {
                state.likedArticleIds = state.likedArticleIds.filter(id => id !== targetId);
                state.databaseArticles = state.databaseArticles.map(art => {
                    if (art.id === targetId) {
                        return { ...art, likes: Math.max(0, (art.likes || 0) - 1) };
                    }
                    return art;
                });
            } else {
                state.likedArticleIds.push(targetId);
                state.databaseArticles = state.databaseArticles.map(art => {
                    if (art.id === targetId) {
                        return { ...art, likes: (art.likes || 0) + 1 };
                    }
                    return art;
                });
            }
            
            localStorage.setItem(`anteiku_liked_${emailKey}`, JSON.stringify(state.likedArticleIds));
            localStorage.setItem('anteiku_articles', JSON.stringify(state.databaseArticles));
            render();
        }

        // TOGGLE LOGIC: EXPLICIT SAVE ARTICLE UTILITY CONTROLLER
        function handleToggleSaveArticle(e, articleId) {
            if (e) e.stopPropagation();
            const targetId = String(articleId);
            const emailKey = sanitizeEmailKey(state.currentEmail);
            
            const isSaved = state.savedArticleIds.includes(targetId);
            if (isSaved) {
                state.savedArticleIds = state.savedArticleIds.filter(id => id !== targetId);
                triggerCustomToast("Article removed from your reading stack. 🔖");
            } else {
                state.savedArticleIds.push(targetId);
                triggerCustomToast("Article saved into your private reading stack! 🔖");
            }
            
            localStorage.setItem(`anteiku_saved_${emailKey}`, JSON.stringify(state.savedArticleIds));
            render();
        }

        // TOGGLE LOGIC: EXPLICIT FOLLOW NOTIFICATION SYSTEM TRACKER
        function handleToggleFollowArticle(e, articleId) {
            if (e) e.stopPropagation();
            const targetId = String(articleId);
            const emailKey = sanitizeEmailKey(state.currentEmail);
            
            const isFollowing = state.followedArticleIds.includes(targetId);
            if (isFollowing) {
                state.followedArticleIds = state.followedArticleIds.filter(id => id !== targetId);
                triggerCustomToast("Unfollowed thread notifications. 🔔");
            } else {
                state.followedArticleIds.push(targetId);
                triggerCustomToast("Subscribed to thread updates! 🔔");
            }
            
            localStorage.setItem(`anteiku_followed_${emailKey}`, JSON.stringify(state.followedArticleIds));
            render();
        }

        // SUBMISSION HANDLER: APPEND PERSISTENT USER COMMENT OBJECT MAPS
        function handleAddComment(e, articleId) {
            if (e) e.preventDefault();
            const commentInput = document.getElementById('comment-box-field');
            if (!commentInput) return;
            const text = commentInput.value.trim();
            if (!text) return;

            const targetId = String(articleId);
            const commentStoreKey = `anteiku_comments_${targetId}`;
            
            let currentComments = [];
            const saved = localStorage.getItem(commentStoreKey);
            if (saved) {
                try { currentComments = JSON.parse(saved); } catch(ex) { currentComments = []; }
            }

            const newCommentObj = {
                id: String(Date.now()),
                username: `@${state.profile.username || 'guest_writer'}`,
                name: state.profile.name || 'Guest Writer',
                text: text,
                timestamp: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
            };

            currentComments.push(newCommentObj);
            localStorage.setItem(commentStoreKey, JSON.stringify(currentComments));
            commentInput.value = '';
            render();
        }

        function handleSignIn(e) {
            if (e) e.preventDefault();
            const emailInput = document.querySelector('input[type="email"]').value.trim();
            
            state.isAuthenticated = true;
            state.currentEmail = emailInput;
            localStorage.setItem('anteiku_authenticated', 'true');
            localStorage.setItem('anteiku_current_email', emailInput);

            const emailKey = sanitizeEmailKey(emailInput);
            const isOnboarded = localStorage.getItem(`anteiku_onboarded_${emailKey}`) === 'true';
            
            const savedProfile = localStorage.getItem(`anteiku_profile_${emailKey}`);
            if (savedProfile) {
                state.profile = JSON.parse(savedProfile);
            } else {
                state.profile = {
                    name: 'Guest Writer',
                    username: 'guest_writer',
                    avatar: defaultCafeAvatars[0],
                    bio: 'Writing from the corner booth.',
                    followers: 0
                };
            }

            const savedLikes = localStorage.getItem(`anteiku_liked_${emailKey}`);
            if (savedLikes) {
                try { state.likedArticleIds = JSON.parse(savedLikes); } catch(err) { state.likedArticleIds = []; }
            } else {
                state.likedArticleIds = [];
            }

            const savedStore = localStorage.getItem(`anteiku_saved_${emailKey}`);
            if (savedStore) {
                try { state.savedArticleIds = JSON.parse(savedStore); } catch(e) { state.savedArticleIds = []; }
            } else {
                state.savedArticleIds = [];
            }

            const followedStore = localStorage.getItem(`anteiku_followed_${emailKey}`);
            if (followedStore) {
                try { state.followedArticleIds = JSON.parse(followedStore); } catch(e) { state.followedArticleIds = []; }
            } else {
                state.followedArticleIds = [];
            }

            state.onboardingNameValue = state.profile.name || '';
            state.onboardingUsernameValue = state.profile.username || '';
            syncProfileFormValues();

            if (!isOnboarded) {
                state.showOnboardingModal = true;
                navigateTo('ONBOARDING');
            } else {
                state.showOnboardingModal = false;
                navigateTo('FEED');
            }
        }

        function syncProfileFormValues() {
            state.editProfileNameValue = state.profile.name || '';
            state.editProfileUsernameValue = state.profile.username || '';
            state.editProfileBioValue = state.profile.bio || '';
            state.editProfileAvatarValue = state.profile.avatar || defaultCafeAvatars[0];
            state.editCustomAvatarSelected = false;
        }

        function liveCheckUsernameUniqueness(inputEl) {
            const rawVal = inputEl.value;
            const cleanedInput = rawVal.trim().replace('@', '').toLowerCase();
            state.onboardingUsernameValue = cleanedInput;

            const errorBox = document.getElementById('username-error-container');
            const submitBtn = document.getElementById('onboarding-submit-btn');

            if (!cleanedInput) {
                if(errorBox) errorBox.classList.add('hidden');
                return;
            }

            let matchesExisting = false;
            const currentEmailKey = sanitizeEmailKey(state.currentEmail);

            for (let i = 0; i < localStorage.length; i++) {
                const storageKey = localStorage.key(i);
                if (storageKey.startsWith('anteiku_profile_')) {
                    if (storageKey === `anteiku_profile_${currentEmailKey}`) continue;
                    try {
                        const parsedUser = JSON.parse(localStorage.getItem(storageKey));
                        if (parsedUser && parsedUser.username && parsedUser.username.toLowerCase() === cleanedInput) {
                            matchesExisting = true;
                            break;
                        }
                    } catch (e) {}
                }
            }

            if (matchesExisting) {
                if(errorBox) errorBox.classList.remove('hidden');
                if(submitBtn) submitBtn.disabled = true;
            } else {
                if(errorBox) errorBox.classList.add('hidden');
                if(submitBtn) submitBtn.disabled = false;
            }
        }

        function handleOnboardingSubmission(e) {
            if (e) e.preventDefault();
            const chosenName = document.getElementById('onboard-name').value.trim();
            const chosenUsername = state.onboardingUsernameValue.trim();
            
            if (!chosenName || !chosenUsername) return;

            const emailKey = sanitizeEmailKey(state.currentEmail);
            state.profile.name = chosenName;
            state.profile.username = chosenUsername;
            state.profile.avatar = defaultCafeAvatars[0];
            
            localStorage.setItem(`anteiku_profile_${emailKey}`, JSON.stringify(state.profile));
            localStorage.setItem(`anteiku_onboarded_${emailKey}`, 'true');
            
            state.showOnboardingModal = false;
            syncProfileFormValues();
            navigateTo('FEED');
        }

        function handleModalProfileUpdate(e) {
            if (e) e.preventDefault();
            const emailKey = sanitizeEmailKey(state.currentEmail);
            const targetUsername = state.editProfileUsernameValue.trim().replace('@', '').toLowerCase();

            if (!state.editProfileNameValue.trim() || !targetUsername) return;

            let structuralCollision = false;
            for (let i = 0; i < localStorage.length; i++) {
                const storageKey = localStorage.key(i);
                if (storageKey.startsWith('anteiku_profile_')) {
                    if (storageKey === `anteiku_profile_${emailKey}`) continue;
                    try {
                        const parsedUser = JSON.parse(localStorage.getItem(storageKey));
                        if (parsedUser && parsedUser.username && parsedUser.username.toLowerCase() === targetUsername) {
                            structuralCollision = true;
                            break;
                        }
                    } catch (ex) {}
                }
            }

            if (structuralCollision) return;

            state.profile.name = state.editProfileNameValue.trim();
            state.profile.username = targetUsername;
            state.profile.bio = state.editProfileBioValue.trim();
            state.profile.avatar = state.editProfileAvatarValue;

            localStorage.setItem(`anteiku_profile_${emailKey}`, JSON.stringify(state.profile));
            state.isEditProfileModalOpen = false;
            render();
        }

        function handleRateArticle(articleId, score) {
            state.databaseArticles = state.databaseArticles.map(art => {
                if (art.id === String(articleId)) {
                    return { ...art, rating: parseInt(score, 10) };
                }
                return art;
            });
            localStorage.setItem('anteiku_articles', JSON.stringify(state.databaseArticles));
            triggerBaristaAppreciation();
        }

        function handlePublishArticle(e) {
            if (e) e.preventDefault();
            const titleInput = document.getElementById('w-title').value.trim();
            const bodyInput = document.getElementById('w-body').value.trim();
            const imgInput = document.getElementById('w-feature-image').value.trim();
            
            if (!titleInput || !bodyInput) return;

            const newPost = {
                id: String(Date.now()),
                title: titleInput,
                content: bodyInput,
                author: state.profile.name,
                handle: `@${state.profile.username}`,
                category: `#${state.writerSelectedCategory}`,
                image: imgInput || 'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&q=80&w=600&h=300',
                likes: 0,
                rating: 5
            };

            state.databaseArticles.unshift(newPost);
            localStorage.setItem('anteiku_articles', JSON.stringify(state.databaseArticles));
            state.activeFilter = '#All';
            navigateTo('FEED');
        }

        function handleModalTabTrap(e, containerId) {
            if (e.key !== 'Tab') return;
            const container = document.getElementById(containerId);
            if (!container) return;
            
            const focusables = container.querySelectorAll('input, button, textarea, select');
            if (focusables.length === 0) return;
            
            const first = focusables[0];
            const last = focusables[focusables.length - 1];
            
            if (e.shiftKey && document.activeElement === first) {
                last.focus();
                e.preventDefault();
            } else if (!e.shiftKey && document.activeElement === last) {
                first.focus();
                e.preventDefault();
            }
        }

        // --- PLATFORM COMPILE ENGINE ---
        function render() {
            const app = document.getElementById('app');

            if (!state.isAuthenticated || state.currentView === 'LANDING') {
                app.innerHTML = `
                    <div class="min-h-screen flex flex-col justify-center items-center p-4 relative">
                        <div class="max-w-md w-full space-y-6 z-10 animate-fadeIn bg-[#16100d] border border-[#3c2a22] p-8 rounded-2xl shadow-2xl">
                            <div class="text-center space-y-2">
                                <div class="flex justify-center mb-1">
                                    <div class="p-4 bg-[#231915] border border-[#523b30] rounded-full"><i data-lucide="coffee" class="w-10 h-10 text-[#fbbf24]"></i></div>
                                </div>
                                <h1 class="text-4xl font-bold tracking-wide text-[#fbbf24]">Anteiku Hub</h1>
                                <p class="text-xs text-[#f5f0eb]/90">Read deeply, write freely.</p>
                            </div>
                            <form onsubmit="handleSignIn(event)" class="space-y-4 pt-2">
                                <div>

                                                : 'bg-[#231915] border-[#453026] hover:border-amber-500 text-white'
                                        }">
                                            <i data-lucide="heart" class="w-4 h-4 ${isArticleLiked ? 'fill-[#0c0806]' : 'text-amber-500'}"></i>
                                            <span>(${post.likes || 0} Likes)</span>
                                        </button>

                                        <button onclick="handleToggleSaveArticle(null, '${post.id}')" class="px-4 py-2 rounded-xl font-semibold flex items-center justify-center gap-2 transition-all shadow-md border text-xs font-mono ${
                                            isArticleSaved 
                                                ? 'bg-amber-500 text-[#0c0806] border-amber-500' 
                                                : 'bg-[#231915] border-[#453026] hover:border-amber-500 text-white'
                                        }">
                                            <i data-lucide="bookmark" class="w-4 h-4 ${isArticleSaved ? 'fill-[#0c0806]' : 'text-amber-500'}"></i>
                                            <span>${isArticleSaved ? 'Saved' : 'Save Article'}</span>
                                        </button>

                                        <button onclick="handleToggleFollowArticle(null, '${post.id}')" class="px-4 py-2 rounded-xl font-semibold flex items-center justify-center gap-2 transition-all shadow-md border text-xs font-mono ${
                                            isArticleFollowed 
                                                ? 'bg-amber-500 text-[#0c0806] border-amber-500' 
                                                : 'bg-[#231915] border-[#453026] hover:border-amber-500 text-white'
                                        }">
                                            <i data-lucide="bell" class="w-4 h-4 ${isArticleFollowed ? 'fill-[#0c0806]' : 'text-amber-500'}"></i>
                                            <span>${isArticleFollowed ? 'Following Thread' : 'Follow Article'}</span>
                                        </button>
                                    </div>

                                    <div class="w-full sm:w-auto flex items-center justify-between sm:justify-start gap-4 bg-[#0c0806] px-4 py-2 rounded-xl border border-[#2d201a]">
                                        <div class="text-left">
                                            <span class="text-[10px] uppercase font-bold text-gray-400 tracking-wider block font-mono">Espresso Roast</span>
                                        </div>
                                        <div class="flex gap-1">${cupsHtml}</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="bg-[#16100d] border border-[#2d201a] rounded-2xl shadow-2xl p-6 md:p-8 space-y-6">
                            <h3 class="text-base font-bold text-[#fbbf24] flex items-center gap-2 font-serif border-b border-[#231915] pb-3">
                                <i data-lucide="message-square" class="w-5 h-5 text-[#fbbf24]"></i> Coffee Desk Discussion 
                                <span class="text-xs font-mono text-gray-400 font-normal">(${articleCommentsList.length} notes logged)</span>
                            </h3>

                            <form onsubmit="handleAddComment(event, '${post.id}')" class="space-y-3">
                                <textarea id="comment-box-field" rows="3" required placeholder="Pour your structural perspectives into the thread discussion box..." class="w-full bg-[#0c0806] border border-[#2d201a] rounded-xl p-3 text-sm text-white focus:outline-none focus:border-[#fbbf24] resize-none leading-relaxed placeholder-gray-500"></textarea>
                                <div class="flex justify-end">
                                    <button type="submit" class="px-5 py-2 bg-[#fbbf24] hover:bg-[#d9a21b] text-[#0c0806] text-xs font-bold uppercase tracking-wider rounded-lg transition-all shadow-md flex items-center gap-1.5">
                                        <i data-lucide="send" class="w-3.5 h-3.5"></i> Post Comment
                                    </button>
                                </div>
                            </form>

                            <div class="space-y-3 pt-2">
                                ${commentsHtmlMarkup || `
                                <div class="p-6 text-center border border-dashed border-[#2d201a] rounded-xl">
                                    <p class="text-xs text-gray-500 italic">No notes logged on this espresso desk. Be the first to append insight!</p>
                                </div>`}
                            </div>
                        </div>
                    </div>`;
            }

            // --- ROUTE DECK: ARTICLE AUTHOR COMPOSER LAYOUT ---
            else if (state.currentView === 'WRITE') {
                target.innerHTML = `
                    <div class="max-w-2xl mx-auto space-y-5">
                        <div class="bg-[#16100d] border border-[#2d201a] p-5 rounded-xl space-y-3">
                            <h3 class="text-xs uppercase tracking-wider font-bold text-white">Assign Stream Category Tag</h3>
                            <div class="flex gap-2 flex-wrap">
                                ${['Gaming', 'Sports', 'Education', 'News', 'GeneralKnowledge'].map(cat => `
                                    <button onclick="state.writerSelectedCategory='${cat}'; render();" class="px-3 py-1.5 rounded-lg text-xs font-mono border ${state.writerSelectedCategory===cat?'border-[#fbbf24] bg-[#231915] text-[#fbbf24]':'border-[#3c2a22] text-gray-400'}"">#${cat}</button>
                                `).join('')}
                            </div>
                        </div>
                        
                        <div class="space-y-4">
                            <input type="text" id="w-title" placeholder="Title your essay..." class="w-full bg-transparent border-b border-[#2d201a] pb-2 text-2xl font-bold text-white focus:outline-none focus:border-[#fbbf24]" />
                            
                            <div class="bg-[#16100d] border border-[#2d201a] p-4 rounded-xl space-y-2">
                                <label class="text-xs font-bold uppercase tracking-wider text-[#fbbf24] flex items-center gap-1.5"><i data-lucide="image" class="w-3.5 h-3.5"></i> Attach Feature Image Illustration Link</label>
                                <input type="url" id="w-feature-image" placeholder="Paste image link URL address here..." class="w-full bg-[#0c0806] border border-[#2d201a] rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-[#fbbf24]" />
                            </div>

                            <textarea id="w-body" rows="8" placeholder="Begin weaving your paragraphs..." class="w-full bg-[#16100d] border border-[#2d201a] rounded-xl p-4 text-sm text-white leading-relaxed focus:outline-none focus:border-[#fbbf24] resize-none"></textarea>
                        </div>
                        
                        <div class="flex justify-end">
                            <button onclick="handlePublishArticle(event)" class="px-6 py-2.5 bg-[#fbbf24] hover:bg-[#d9a21b] text-[#0c0806] text-xs font-bold rounded-lg tracking-wider uppercase transition-all shadow-md">Publish Content Node</button>
                        </div>
                    </div>`;
            }

            // --- ROUTE DECK: USER ACCOUNT LEDGER TRACKER ---
            else if (state.currentView === 'ACCOUNT') {
                let personalArticles = state.databaseArticles.filter(a => a.author === state.profile.name);
                let dashboardCardsHtml = personalArticles.map(p => `
                    <div onclick="viewArticleNodeDetails('${p.id}')" class="bg-[#0c0806] border border-[#2d201a] rounded-xl overflow-hidden shadow flex flex-col cursor-pointer hover:border-[#fbbf24]/40 transition-colors group p-4">
                        <div class="space-y-2">
                            <span class="text-[10px] font-mono text-[#fbbf24] bg-[#231915] px-2 py-0.5 rounded border border-[#3c2a22]">${p.category}</span>
                            <h4 class="text-sm font-bold text-[#fbbf24] pt-1 group-hover:text-amber-400">${p.title}</h4>
                            <p class="text-xs text-white font-light line-clamp-2 leading-relaxed">${p.content || p.body}</p>
                        </div>
                    </div>`).join('');

                target.innerHTML = `
                    <div class="space-y-6 max-w-3xl mx-auto">
                        <div class="bg-[#16100d] border border-[#2d201a] p-6 rounded-2xl flex flex-col sm:flex-row items-center gap-5 shadow-xl">
                            <img src="${state.profile.avatar || defaultCafeAvatars[0]}" class="h-20 w-20 rounded-2xl object-cover border-2 border-[#fbbf24]/50 bg-[#0c0806]" alt="" />
                            <div class="space-y-1 text-center sm:text-left flex-1">
                                <h2 class="text-2xl font-bold tracking-wide text-[#fbbf24] font-serif">${state.profile.name}</h2>
                                <p class="text-xs font-mono text-gray-400">Identity Ledger Handle: <span class="text-[#fbbf24]">@${state.profile.username}</span></p>
                                <p class="text-xs text-white font-light pt-1.5 leading-relaxed">${state.profile.bio || 'Writing from the corner booth.'}</p>
                            </div>
                            <div class="px-5 py-2.5 bg-[#0c0806] rounded-xl border border-[#2d201a] text-center shrink-0 min-w-[100px]">
                                <span class="text-[10px] uppercase text-gray-400 block font-mono tracking-wider font-semibold">Total Followers</span>
                                <b class="text-xl font-bold text-[#fbbf24]">${state.profile.followers || 0}</b>
                            </div>
                        </div>

                        <div class="bg-[#16100d] border border-[#2d201a] p-6 rounded-xl space-y-4">
                            <h3 class="text-xs uppercase tracking-widest font-bold text-[#fbbf24] border-b border-[#2d201a] pb-2 flex items-center gap-1.5"><i data-lucide="book-open" class="w-3.5 h-3.5"></i> My Published Posts</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                ${dashboardCardsHtml || '<p class="text-xs text-gray-400 italic p-4 col-span-2 text-center">No articles written by this table token node yet.</p>'}
                            </div>
                        </div>
                    </div>`;
            }

            lucide.createIcons();
        }

        render();
    </script>
</body>
</html>
