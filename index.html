<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Espresso Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0c0806;
        }

        /* KEEP THE SMOKY CAFE AMBIANCE (DEEP ESPRESSO GRADIENT & STEAM LINES) */
        .cafe-gradient {
            background: linear-gradient(135deg, #0c0806 0%, #16110f 100%);
        }

        @keyframes steam-rise {
            0% { transform: translateY(100%) scaleX(1); opacity: 0; }
            15% { opacity: 0.06; }
            50% { transform: translateY(50%) scaleX(1.2); opacity: 0.04; }
            85% { opacity: 0.02; }
            100% { transform: translateY(-20%) scaleX(0.8); opacity: 0; }
        }

        .steam-line {
            position: absolute;
            width: 2px;
            height: 350px;
            background: linear-gradient(to top, transparent, #f4f1ee, transparent);
            pointer-events: none;
            opacity: 0;
        }
        .steam-1 { left: 15%; animation: steam-rise 7s infinite linear; }
        .steam-2 { left: 50%; animation: steam-rise 9s infinite linear; animation-delay: 2s; }
        .steam-3 { left: 80%; animation: steam-rise 8s infinite linear; animation-delay: 4.5s; }
    </style>
</head>
<body class="cafe-gradient text-[#f4f1ee] min-h-screen relative overflow-x-hidden select-none">

    <div class="absolute inset-0 overflow-hidden pointer-events-none z-0" aria-hidden="true">
        <div class="steam-line steam-1"></div>
        <div class="steam-line steam-2"></div>
        <div class="steam-line steam-3"></div>
    </div>

    <div id="cafe-platform-root" class="min-h-screen flex flex-col relative z-10"></div>

    <script>
        // HARDCODED FALLBACK ARTICLES (5 HIGH CONTRAST DATA NODES)
        const HARDCODED_ARTICLES = [
            {
                id: 1,
                title: "The Art of the Perfect Microfoam",
                author: "Barista Elena",
                excerpt: "Achieving that glossy, wet-paint texture requires precise steam wand positioning and absolute temperature control at 140°F.",
                category: "Technique",
                readTime: "4 min read",
                rating: 5
            },
            {
                id: 2,
                title: "Unlocking Ethiopian Yirgacheffe",
                author: "Roaster Liam",
                excerpt: "A deep dive into the floral, bergamot, and bright citrus notes that define one of the world's most celebrated washed coffees.",
                category: "Origin Spotlight",
                readTime: "6 min read",
                rating: 4
            },
            {
                id: 3,
                title: "Cold Brew vs. Flash Chilled",
                author: "Cafe Owner Marcus",
                excerpt: "Why oxidation control during flash chilling preserves volatile aromatics that traditional 24-hour steep cycles leave behind.",
                category: "Brew Methods",
                readTime: "5 min read",
                rating: 4
            },
            {
                id: 4,
                title: "The Physics of Extraction Yield",
                author: "Dr. Coffee",
                excerpt: "How particle size distribution and channel formation alter your total dissolved solids (TDS) and ruin sweet extractions.",
                category: "Science",
                readTime: "8 min read",
                rating: 5
            },
            {
                id: 5,
                title: "Designing the Modern Espresso Bar",
                author: "Architect Sara",
                excerpt: "Optimizing the workflow triangle between the grinder, espresso machine, and knock box to shave seconds off ticket times.",
                category: "Design",
                readTime: "7 min read",
                rating: 3
            }
        ];

        // ENGINE APPLICATION STATE CONTROL
        let state = {
            activeTab: 'Main Lounge', // "The Community" state fully purged
            articles: [...HARDCODED_ARTICLES],
            hoveredArticleId: null,
            hoveredValue: 0,
            toastActive: false,
            uploadedImage: null
        };

        // UI MUTATOR ACTIONS
        function setActiveTab(tabName) {
            state.activeTab = tabName;
            renderApp();
        }

        // RATING AND TOAST MUTATOR EXECUTION
        function rateArticle(articleId, value) {
            state.articles = state.articles.map(art => 
                art.id === articleId ? { ...art, rating: value } : art
            );
            
            // Trigger Barista Feedback loop
            state.toastActive = true;
            renderApp();

            setTimeout(() => {
                state.toastActive = false;
                renderApp();
            }, 3500);
        }

        function handleImgUpload(event) {
            const file = event.target.files[0];
            if (file) {
                state.uploadedImage = URL.createObjectURL(file);
                renderApp();
            }
        }

        function processNewArticle(e) {
            e.preventDefault();
            const title = document.getElementById('form-title').value.trim();
            const category = document.getElementById('form-category').value.trim();
            const excerpt = document.getElementById('form-content').value.trim();

            if (!title || !excerpt) return;

            const customArticle = {
                id: Date.now(),
                title: title,
                author: "Head Roaster (You)",
                excerpt: excerpt,
                category: category || "General",
                readTime: "3 min read",
                rating: 0
            };

            state.articles.unshift(customArticle);
            state.uploadedImage = null;
            state.activeTab = 'Main Lounge';
            renderApp();
        }

        // RE-RENDER COMPOSITION ENGINE
        function renderApp() {
            const root = document.getElementById('cafe-platform-root');

            root.innerHTML = `
                <header class="border-b border-[#2a1e17] bg-[#0c0806]/90 backdrop-blur-md sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="bg-[#d97706] p-2 rounded-xl text-[#0c0806]">
                            <i data-lucide="coffee" class="w-6 h-6 stroke-[2.5]"></i>
                        </div>
                        <div>
                            <h1 class="text-lg font-bold tracking-tight text-[#d97706]">THE ESPRESSO ARCHIVE</h1>
                            <p class="text-[10px] text-[#a39284] tracking-widest uppercase font-semibold">Smoky Lounge Platform</p>
                        </div>
                    </div>

                    <div class="flex items-center gap-4">
                        <button class="relative p-2 rounded-lg text-[#a39284] hover:text-[#f4f1ee] hover:bg-[#2a1e17] transition-all">
                            <i data-lucide="bell" class="w-5 h-5"></i>
                            <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-[#d97706] rounded-full"></span>
                        </button>
                        
                        <button class="flex items-center gap-2 bg-[#2a1e17] hover:bg-[#3d2c22] border border-[#3d2c22] text-[#f4f1ee] px-4 py-2 rounded-xl text-sm font-medium transition-all">
                            <i data-lucide="user" class="w-4 h-4 text-[#d97706]"></i>
                            <span>Edit Profile</span>
                        </button>
                    </div>
                </header>

                <div class="flex flex-1 relative">
                    
                    <aside class="w-72 border-r border-[#2a1e17] bg-[#0c0806]/40 p-4 flex flex-col gap-2 shrink-0">
                        <p class="text-[10px] font-bold tracking-wider text-[#543d2b] uppercase px-3 mb-2">Navigation Matrix</p>
                        
                        <button onclick="setActiveTab('Main Lounge')" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-xl text-sm font-semibold transition-all ${state.activeTab === 'Main Lounge' ? 'bg-[#d97706] text-[#0c0806]' : 'text-[#a39284] hover:text-[#f4f1ee] hover:bg-[#1f1611]'}"">
                            <i data-lucide="compass" class="w-5 h-5"></i>
                            <span>Main Lounge</span>
                        </button>

                        <button onclick="setActiveTab('Write Article')" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-xl text-sm font-semibold transition-all ${state.activeTab === 'Write Article' ? 'bg-[#d97706] text-[#0c0806]' : 'text-[#a39284] hover:text-[#f4f1ee] hover:bg-[#1f1611]'}"">
                            <i data-lucide="pen-tool" class="w-5 h-5"></i>
                            <span>Write Article</span>
                        </button>

                        <button onclick="setActiveTab('Account Management')" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-xl text-sm font-semibold transition-all ${state.activeTab === 'Account Management' ? 'bg-[#d97706] text-[#0c0806]' : 'text-[#a39284] hover:text-[#f4f1ee] hover:bg-[#1f1611]'}"">
                            <i data-lucide="settings" class="w-5 h-5"></i>
                            <span>Account Management</span>
                        </button>
                    </aside>

                    <main class="flex-1 p-8 max-w-4xl mx-auto w-full">
                        
                        ${state.activeTab === 'Main Lounge' ? `
                            <div class="space-y-6">
                                <div class="border-b border-[#2a1e17] pb-4">
                                    <h2 class="text-xl font-bold text-[#f4f1ee]">The Main Lounge Feed</h2>
                                    <p class="text-xs text-[#a39284]">Freshly brewed documentation assets mapping properly</p>
                                </div>

                                <div class="grid gap-5">
                                    ${state.articles.map(article => {
                                        let coffeeSystemHtml = '';
                                        for(let i = 1; i <= 5; i++) {
                                            const isAmberLit = state.hoveredArticleId === article.id ? (i <= state.hoveredValue) : (i <= article.rating);
                                            coffeeSystemHtml += `
                                                <button 
                                                    onclick="rateArticle(${article.id}, ${i})"
                                                    onmouseenter="state.hoveredArticleId=${article.id}; state.hoveredValue=${i}; renderApp();"
                                                    onmouseleave="state.hoveredArticleId=null; state.hoveredValue=0; renderApp();"
                                                    class="focus:outline-none transition-transform active:scale-90"
                                                >
                                                    <i data-lucide="coffee" class="w-5 h-5 ${isAmberLit ? 'text-[#d97706] fill-[#d97706] drop-shadow-[0_0_5px_rgba(217,119,6,0.5)]' : 'text-[#3d2c22] fill-transparent'}"></i>
                                                </button>
                                            `;
                                        }

                                        return `
                                            <article class="bg-[#140e0b] border border-[#2a1e17] rounded-2xl p-6 hover:border-[#3d2c22] transition-all shadow-xl">
                                                <div class="flex items-center justify-between gap-4 mb-3">
                                                    <span class="text-[10px] font-bold tracking-wide uppercase text-[#d97706] bg-[#2a1e17] px-2.5 py-1 rounded-md">${article.category}</span>
                                                    <span class="text-xs text-[#a39284]">${article.readTime}</span>
                                                </div>
                                                <h3 class="text-lg font-bold text-[#f4f1ee] mb-2">${article.title}</h3>
                                                <p class="text-sm text-[#c4b5a6] leading-relaxed mb-4">${article.excerpt}</p>
                                                
                                                <div class="pt-4 border-t border-[#1f1611] flex items-center justify-between">
                                                    <span class="text-xs text-[#a39284]">By <span class="text-[#f4f1ee] font-medium">${article.author}</span></span>
                                                    
                                                    <div class="flex items-center gap-3 bg-[#0c0806] px-3 py-1.5 rounded-xl border border-[#1f1611]">
                                                        <span class="text-[10px] font-bold text-[#a39284] uppercase tracking-wider">Aroma:</span>
                                                        <div class="flex gap-1">${coffeeSystemHtml}</div>
                                                    </div>
                                                </div>
                                            </article>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        ` : ''}

                        ${state.activeTab === 'Write Article' ? `
                            <div class="space-y-6 max-w-xl">
                                <div>
                                    <h2 class="text-xl font-bold text-[#f4f1ee]">Brew New Copy Asset</h2>
                                    <p class="text-xs text-[#a39284]">Pour down your custom text metrics directly into the stream</p>
                                </div>

                                <form onsubmit="processNewArticle(event)" class="space-y-4 bg-[#140e0b] border border-[#2a1e17] rounded-2xl p-6">
                                    <div>
                                        <label class="block text-[10px] font-bold text-[#a39284] uppercase tracking-wider mb-1.5">Headline</label>
                                        <input type="text" id="form-title" required placeholder="The Physics of Extraction Dynamics" class="w-full bg-[#0c0806] border border-[#2a1e17] rounded-xl px-4 py-2.5 text-sm text-[#f4f1ee] focus:outline-none focus:border-[#d97706]" />
                                    </div>
                                    <div>
                                        <label class="block text-[10px] font-bold text-[#a39284] uppercase tracking-wider mb-1.5">Category Tag</label>
                                        <input type="text" id="form-category" placeholder="Technique" class="w-full bg-[#0c0806] border border-[#2a1e17] rounded-xl px-4 py-2.5 text-sm text-[#f4f1ee] focus:outline-none focus:border-[#d97706]" />
                                    </div>
                                    
                                    <div>
                                        <label class="block text-[10px] font-bold text-[#a39284] uppercase tracking-wider mb-1.5">Graphic Visual Asset</label>
                                        <div class="border-2 border-dashed border-[#2a1e17] rounded-xl p-4 bg-[#0c0806] text-center hover:border-[#3d2c22] transition-colors relative">
                                            <input type="file" accept="image/*" onchange="handleImgUpload(event)" class="absolute inset-0 opacity-0 cursor-pointer" />
                                            ${state.uploadedImage ? `
                                                <div class="relative max-h-36 overflow-hidden rounded-lg">
                                                    <img src="${state.uploadedImage}" class="w-full object-cover" />
                                                </div>
                                            ` : `
                                                <div class="flex flex-col items-center py-2 text-[#a39284]">
                                                    <i data-lucide="image" class="w-6 h-6 mb-1 text-[#d97706]"></i>
                                                    <p class="text-xs font-medium">Attach Layout Image Reference File</p>
                                                </div>
                                            `}
                                        </div>
                                    </div>

                                    <div>
                                        <label class="block text-[10px] font-bold text-[#a39284] uppercase tracking-wider mb-1.5">Article Body Context</label>
                                        <textarea id="form-content" required rows="5" placeholder="Pour structural technical text out here..." class="w-full bg-[#0c0806] border border-[#2a1e17] rounded-xl px-4 py-2.5 text-sm text-[#f4f1ee] focus:outline-none focus:border-[#d97706] resize-none"></textarea>
                                    </div>

                                    <button type="submit" class="w-full bg-[#d97706] hover:bg-[#b45309] text-[#0c0806] font-bold py-3 rounded-xl text-xs uppercase tracking-wider transition-colors flex items-center justify-center gap-2">
                                        <i data-lucide="send" class="w-4 h-4"></i> Commit Draft into Lounge
                                    </button>
                                </form>
                            </div>
                        ` : ''}

                        ${state.activeTab === 'Account Management' ? `
                            <div class="space-y-6 max-w-xl">
                                <div>
                                    <h2 class="text-xl font-bold text-[#f4f1ee]">Account Configuration</h2>
                                    <p class="text-xs text-[#a39284]">Manage security credentials, tokens, and active profile access parameters</p>
                                </div>
                                <div class="bg-[#140e0b] border border-[#2a1e17] rounded-2xl p-5 space-y-3">
                                    <div class="flex items-center justify-between p-3.5 bg-[#0c0806] border border-[#1f1611] rounded-xl">
                                        <div>
                                            <p class="text-sm font-medium text-[#f4f1ee]">System Profile</p>
                                            <p class="text-[11px] text-[#a39284]">Active Profile: Head Roaster Matrix</p>
                                        </div>
                                        <span class="text-[10px] px-2 py-0.5 rounded bg-[#2a1e17] text-[#d97706] font-mono font-bold">ACTIVE</span>
                                    </div>
                                </div>
                            </div>
                        ` : ''}

                    </main>
                </div>

                <div class="fixed bottom-6 right-6 z-[100] transform transition-all duration-300 ease-out ${state.toastActive ? 'translate-y-0 opacity-100' : 'translate-y-4 opacity-0 pointer-events-none'}">
                    <div class="bg-[#1c1410] border-2 border-[#d97706] px-5 py-3.5 rounded-xl shadow-2xl flex items-center gap-3">
                        <div class="bg-[#d97706] text-[#0c0806] p-1 rounded-md">
                            <i data-lucide="coffee" class="w-4 h-4 fill-current"></i>
                        </div>
                        <p class="text-xs font-bold tracking-wide text-[#f4f1ee]">The Barista appreciates your rating! ☕✨</p>
                    </div>
                </div>
            `;

            // Re-instantiate Icons Globally
            lucide.createIcons();
        }

        // Initialize App Viewport Engine
        renderApp();
    </script>
</body>
</html>
